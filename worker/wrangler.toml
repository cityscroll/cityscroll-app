name = "crol-worker"
main = "src/worker.mjs"
compatibility_date = "2026-07-27"
# No nodejs_compat needed — the Worker uses only fetch + Web APIs (no npm runtime deps).

# Branded public hostname: user-visible URLs (feed links, confirm links) read api.crol-list.org,
# not *.workers.dev. Custom Domain — Cloudflare creates the DNS record + certificate in the
# crol-list.org zone on deploy; the workers.dev URL keeps working as an alias.
#
# cityscroll.org / www.cityscroll.org — a parallel serving domain (crol-list.org stays
# canonical; see index.html's <link rel="canonical">). Same custom-domain mechanism, same
# deploy; the worker answers these two hosts by reverse-proxying the static site straight
# from crol-list.org (src/mirror.mjs) so the mirror can never drift out of sync.
routes = [
  { pattern = "api.crol-list.org", custom_domain = true },
  { pattern = "cityscroll.org", custom_domain = true },
  { pattern = "www.cityscroll.org", custom_domain = true },
]
# Adding routes implicitly DISABLES workers.dev unless this is explicit — keep the alias alive
# so older cached pages and any in-flight confirm links (24h TTL) don't break.
workers_dev = true

# Daily alerts digest. Dry-run until ALERTS_LIVE="true". 13:00 UTC ≈ 9am ET.
[triggers]
crons = ["0 13 * * *"]

# Non-secret config. Secrets (ANTHROPIC_API_KEY, RESEND_API_KEY, USAGE_KEY,
# ANALYTICS_READ_TOKEN, ANALYTICS_DEV_KEY, ANALYTICS_ENVIRONMENT) go via `wrangler secret put`.
# USAGE_KEY gates the read-only /usage endpoint; unset → /usage 404s. ANALYTICS_READ_TOKEN needs
# . ANALYTICS_ENVIRONMENT must equal "production" for analytics writes;
# keeping that runtime binding out of this file makes wrangler dev/preview fail closed by default.
[vars]
ALERTS_LIVE = "true"
ALERTS_FROM = "CROL-List <alerts@crol-list.org>"
# Spend guards (denial-of-wallet ceiling). MAX_SENDS_PER_DAY stays under Resend's free 100/day.
MAX_PER_RUN = "25"
MAX_SENDS_PER_DAY = "50"
# Confidence feature: quiet days before a DAILY sub gets a "still watching" heartbeat (weekly subs
# always get their weekly email). So silence never looks like a broken alert. Default 14.
HEARTBEAT_DAYS = "14"
# Operator inbox for /feedback notifications (non-secret → a var, not a secret). The Cloudflare
# Email Routing catch-all already routes any *@crol-list.org here, so no new routing rule is
# strictly required; a dedicated feedback@ rule just enables plus-alias auto-filtering.
FEEDBACK_TO = "feedback@crol-list.org"
# Inbound subscribe-by-email (Email Routing route: SUBSCRIBE_ADDRESS -> this Worker;
# set the route in the dashboard). Spend ceilings for the LLM-backed surfaces:
SUBSCRIBE_ADDRESS = "subscribe@crol-list.org"
INBOUND_MAX_PER_DAY = "100"
MCP_MAX_CALLS_PER_DAY = "200"
MCP_MAX_PER_IP_DAY = "300"
# Digest delivery mode: "true" = queue fan-out (see [[queues.*]]), unset/other = inline.
QUEUE_DIGESTS = "true"
# Board-notification bridge (org webhook projects_v2_item -> issue comments), provided by
# the optional "board-notify" npm dependency — see worker/README.md's "Board notifications"
# section and https://github.com/jimdc/board-notify for the full config/secret reference.
# Auth secrets (App-first, zero-downtime fallback):
#   BOARDNOTIFY_APP_ID, BOARDNOTIFY_APP_PRIVATE_KEY, BOARDNOTIFY_INSTALLATION_ID — the
#     board-notify GitHub App's own bot identity. Provision via 
#     (one-click manifest-flow creation kit) then see its INSTALL.md for the secret puts.
#    — fallback when the App secrets above are
#     unset; keep configured until the App path is confirmed working, or drop it after.
#   BOARD_HOOK_SECRET (HMAC) — required regardless of auth path; the webhook fails closed
#     without it (and every var below is optional — a fork that never sets these ships a
#     working crol-list with the bridge simply switched off).
# BOARDNOTIFY_CC: comma-separated GitHub logins (no "@"), appended as "cc @a @b" on every
# comment — mentions notify org members regardless of their own subscription state.
# Non-secret, so it lives here rather than `wrangler secret put`. Empty = no cc line.
BOARDNOTIFY_CC = "jimdc,michaeljohnsheehan-a11y,devdoshi,abannabao"
BOARD_PROJECT_IDS = "PVT_kwDOEgVDsM4BdE22"
BOARD_ORG = "cityscroll"
BOARD_URL = "https://github.com/orgs/cityscroll/projects/1"
BOARD_HOOK_DRY = "false"
BOARD_HOOK_MAX_PER_DAY = "100"
ANALYTICS_ACCOUNT_ID = "8162581cb1d97e20a172031adb8a13af"
ANALYTICS_DATASET = "crol_usage_events_v1"
ANALYTICS_MEASURED_SINCE = "2026-07-27"
# Wave 4 source custody is fail-closed. Set this to "true" only after the
# content-policy fixtures and the automatically provisioned bucket are ready.
SOURCE_VAULT_ENABLED = "false"

# The source vault is the wave's only new infrastructure binding. Omitting a
# bucket_name asks current Wrangler to provision an R2 bucket for this binding.
[[r2_buckets]]
binding = "SOURCE_VAULT"

# Privacy-preserving event rows: bounded taxonomy dimensions only, no visitor identifier.
[[analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "crol_usage_events_v1"

# Digest delivery queue. QUEUE_DIGESTS="true" switches the cron from
# the inline send loop to one-job-per-subscription fan-out: independently retryable,
# poison subs -> DLQ, daily send cap still enforced in the consumer. max_concurrency=1
# keeps the shared daily counter honest.
[[queues.producers]]
binding = "DIGEST_QUEUE"
queue = "crol-digests"

[[queues.consumers]]
queue = "crol-digests"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
max_concurrency = 1
dead_letter_queue = "crol-digests-dlq"

# D1 mirror of City Record notices (Socrata stays the source of truth; the daily cron
# refreshes it -- see src/ingest.mjs). Created via `wrangler d1 create crol-notices`;
# apply schema with `npx wrangler d1 migrations apply crol-notices --remote`.
[[d1_databases]]
binding = "DB"
database_name = "crol-notices"
database_id = "df70a39c-6465-4b4a-b108-a792c79e74e8"
migrations_dir = "migrations"

# KV namespaces. Create them once, then paste the printed ids below:
#   npx wrangler kv namespace create NL_METER
#   npx wrangler kv namespace create ALERT_STATE
[[kv_namespaces]]
binding = "NL_METER"
id = "f410ee870b954e2980ee646312704014"

# board-notify's handler reads env.METER for its daily surface cap; same namespace as
# NL_METER (not a migration — the "boardhook" counter just keeps counting from one store).
[[kv_namespaces]]
binding = "METER"
id = "f410ee870b954e2980ee646312704014"

[[kv_namespaces]]
binding = "ALERT_STATE"
id = "451ce64e616b49b6837682e75cb07756"

# Confirmed subscriptions + per-IP/per-address rate-limit counters for /subscribe.
# /subscribe FAILS CLOSED (503) until TURNSTILE_SECRET + TOKEN_SECRET are also set, so this
# binding existing is harmless until Turnstile is provisioned.
[[kv_namespaces]]
binding = "SUBS"
id = "a7addee904774e7c90f9be447f927b20"

# Stored feedback rows (fb:<ts>:<rand>) + /feedback per-IP/per-address rate-limit counters.
# /feedback FAILS CLOSED (503) until TURNSTILE_SECRET + RESEND_API_KEY are also set, so this
# binding existing is harmless on its own. Created via `wrangler kv namespace create FEEDBACK`.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "75d85d23ec914d8ea44bc3e9bb540afd"

# The beta Worker is a separate, manually deployed environment. Environment
# bindings are non-inheritable, so this intentionally has no production KV,
# D1, R2, Analytics Engine, Queue, cron, or secret configuration.
[env.beta]
routes = [
  { pattern = "api-beta.crol-list.org", custom_domain = true },
]
workers_dev = true

[env.beta.vars]
DEPLOYMENT_CHANNEL = "beta"
ALERTS_LIVE = "false"
QUEUE_DIGESTS = "false"
ANALYTICS_ENVIRONMENT = "preview"
SOURCE_VAULT_ENABLED = "false"
BOARD_HOOK_DRY = "true"
CONFIRM_BASE = "https://api-beta.crol-list.org"
