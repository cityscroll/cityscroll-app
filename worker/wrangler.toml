name = "crol-worker"
main = "src/worker.mjs"
compatibility_date = "2026-07-27"
# No nodejs_compat needed — the Worker uses only fetch + Web APIs (no npm runtime deps).

# API URLs use api.cityscroll.org. api.crol-list.org remains a compatibility
# alias for existing clients and in-flight confirmation links. Bounded path routes
# put reader-facing dynamic documents on the canonical site without reclaiming the
# rest of the Pages hostname.
routes = [
  { pattern = "api.cityscroll.org", custom_domain = true },
  { pattern = "api.crol-list.org", custom_domain = true },
  { pattern = "cityscroll.org/near-you*", zone_name = "cityscroll.org" },
  { pattern = "cityscroll.org/following*", zone_name = "cityscroll.org" },
  { pattern = "cityscroll.org/prefs*", zone_name = "cityscroll.org" },
]
# Adding routes implicitly DISABLES workers.dev unless this is explicit — keep the alias alive
# so older cached pages and any in-flight confirm links (24h TTL) don't break.
workers_dev = true

# Daily alerts digest at 13:00 UTC (09:00 ET) plus a delivery-free rehearsal at
# 10:00 UTC (06:00 ET). The rehearsal renders inline and persists private D1 previews.
[triggers]
crons = [
  "0 10 * * *",
  "0 13 * * *",
]

# Non-secret config. Secrets go via `wrangler secret put` (see worker/README.md).
# USAGE_KEY gates the read-only /usage endpoint; unset → /usage 404s.
# ANALYTICS_ENVIRONMENT must equal "production" for Analytics Engine writes. It lives in
# vars (not a secret) so a production deploy cannot silently drop every event. Local
# wrangler dev still fails closed when the USAGE_ANALYTICS binding is absent. The beta
# environment overrides this to "preview".
[vars]
ALERTS_LIVE = "true"
ANALYTICS_ENVIRONMENT = "production"
# Shadow-only identity capture. Public reads do not consume these tables.
CITY_RECORD_SOURCE_RECORD_DUAL_WRITE = "true"
PASSPORT_SOURCE_RECORD_DUAL_WRITE = "true"
CHECKBOOK_SOURCE_RECORD_DUAL_WRITE = "true"
LEGISTAR_SOURCE_RECORD_DUAL_WRITE = "true"
PERSON_HUB_SOURCE_RECORD_DUAL_WRITE = "true"
ULURP_RECOMMENDATION_PDF_SOURCE_RECORD_DUAL_WRITE = "true"
ENTITY_LINK_DUAL_WRITE = "true"
# Durable civic-time event append (D1 civic_time_events). Default OFF — pure adapter
# seam only until an operator opts in. Set "true" to persist envelopes from adapters.
CIVIC_TIME_EVENT_WRITE = "false"
CONFIRM_BASE = "https://api.cityscroll.org"
# Alerts sender (site owner decision 2026-07-29).
ALERTS_FROM = "CityScroll <alerts@cityscroll.org>"
# Human replies: cityscroll.org has no apex MX, so replies to the From address bounce.
# crol-list.org still has Cloudflare email routing; keep Reply-To on the old digest address.
ALERTS_REPLY_TO = "alerts@crol-list.org"
# Spend guards (denial-of-wallet ceiling). MAX_SENDS_PER_DAY stays under Resend's free 100/day.
MAX_PER_RUN = "25"
MAX_SENDS_PER_DAY = "50"
# Quiet days before a DAILY sub gets a "still watching" heartbeat (weekly subs always email).
HEARTBEAT_DAYS = "14"
# Graduated digest safety: hold all delivery after three calendar days without a READY rehearsal.
# Three days gives the operator a repair window while bounding the risk of stale validation.
DIGEST_SHADOW_DARK_DAYS = "3"
DIGEST_SHADOW_ALERTS = "true"
# Operator inbox for /feedback notifications (non-secret var).
FEEDBACK_TO = "feedback@cityscroll.org"
# Inbound subscribe-by-email address; spend ceilings for LLM-backed surfaces:
SUBSCRIBE_ADDRESS = "subscribe@crol-list.org"
INBOUND_MAX_PER_DAY = "100"
MCP_MAX_CALLS_PER_DAY = "200"
MCP_MAX_PER_IP_DAY = "300"
# Informal notice translation (GET /translate/<id>?lang=): daily ceiling on NEW
# translations only — cache hits never spend the meter.
TRANSLATE_MAX_CALLS_PER_DAY = "150"
# Digest delivery mode: "true" = queue fan-out (see [[queues.*]]), unset/other = inline.
QUEUE_DIGESTS = "true"
ANALYTICS_ACCOUNT_ID = "8162581cb1d97e20a172031adb8a13af"
ANALYTICS_DATASET = "crol_usage_events_v1"
ANALYTICS_MEASURED_SINCE = "2026-07-27"
# Wave 4 source custody is fail-closed. Set this to "true" only after the
# content-policy fixtures and the automatically provisioned bucket are ready.
SOURCE_VAULT_ENABLED = "false"

# The source vault is the wave's only new infrastructure binding. Omitting a
# bucket_name asks current Wrangler to provision an R2 bucket for this binding.
# [[r2_buckets]]
# binding = "SOURCE_VAULT"

# Privacy-preserving event rows: bounded taxonomy dimensions only, no visitor identifier.
[[analytics_engine_datasets]]
binding = "USAGE_ANALYTICS"
dataset = "crol_usage_events_v1"

# Digest delivery queue. QUEUE_DIGESTS="true" switches the cron from the inline
# send loop to one-job-per-account fan-out (type rollup | sub via buildDigestJobs):
# independently retryable, poison jobs -> DLQ, daily send cap still enforced in the
# consumer. max_concurrency=1 keeps the shared daily counter honest.
[[queues.producers]]
binding = "DIGEST_QUEUE"
queue = "crol-digests"

[[queues.consumers]]
queue = "crol-digests"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
max_concurrency = 1
dead_letter_queue = "crol-digests-dlq"

# D1 mirror of City Record notices (Socrata stays the source of truth; the daily cron
# refreshes it -- see src/ingest.mjs). Created via `wrangler d1 create crol-notices`;
# apply schema with `npx wrangler d1 migrations apply crol-notices --remote`.
[[d1_databases]]
binding = "DB"
database_name = "crol-notices"
database_id = "df70a39c-6465-4b4a-b108-a792c79e74e8"
migrations_dir = "migrations"

# KV namespaces. Create them once, then paste the printed ids below:
#   npx wrangler kv namespace create NL_METER
#   npx wrangler kv namespace create ALERT_STATE
[[kv_namespaces]]
binding = "NL_METER"
id = "f410ee870b954e2980ee646312704014"

[[kv_namespaces]]
binding = "ALERT_STATE"
id = "451ce64e616b49b6837682e75cb07756"

# Confirmed subscriptions + per-IP/per-address rate-limit counters for /subscribe.
# /subscribe FAILS CLOSED (503) until TOKEN_SECRET + RESEND_API_KEY are also set.
# Turnstile is not required on this path (rate limits + double opt-in remain).
[[kv_namespaces]]
binding = "SUBS"
id = "a7addee904774e7c90f9be447f927b20"

# Stored feedback rows (fb:<ts>:<rand>) + /feedback per-IP/per-address rate-limit counters.
# /feedback FAILS CLOSED (503) until TURNSTILE_SECRET + RESEND_API_KEY are also set, so this
# binding existing is harmless on its own. Created via `wrangler kv namespace create FEEDBACK`.
[[kv_namespaces]]
binding = "FEEDBACK"
id = "75d85d23ec914d8ea44bc3e9bb540afd"

# The beta Worker is a separate, manually deployed environment. Environment
# bindings are non-inheritable, so this intentionally has no production KV,
# D1, R2, Analytics Engine, Queue, cron, or secret configuration.
[env.beta]
routes = [
  { pattern = "api-beta.cityscroll.org", custom_domain = true },
  { pattern = "api-beta.crol-list.org", custom_domain = true },
]
workers_dev = true

[env.beta.vars]
DEPLOYMENT_CHANNEL = "beta"
ALERTS_LIVE = "false"
CITY_RECORD_SOURCE_RECORD_DUAL_WRITE = "false"
PASSPORT_SOURCE_RECORD_DUAL_WRITE = "false"
CHECKBOOK_SOURCE_RECORD_DUAL_WRITE = "false"
LEGISTAR_SOURCE_RECORD_DUAL_WRITE = "false"
PERSON_HUB_SOURCE_RECORD_DUAL_WRITE = "false"
ULURP_RECOMMENDATION_PDF_SOURCE_RECORD_DUAL_WRITE = "false"
ENTITY_LINK_DUAL_WRITE = "false"
CIVIC_TIME_EVENT_WRITE = "false"
QUEUE_DIGESTS = "false"
ANALYTICS_ENVIRONMENT = "preview"
SOURCE_VAULT_ENABLED = "false"
CONFIRM_BASE = "https://api-beta.cityscroll.org"
