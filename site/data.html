<style>
  :root {
    --paper: #f4efe4;
    --ink: #1a1714;
    --ink-soft: #3b342c;
    --oxblood: #7a1f1f;
    --font-body: Georgia, serif;
    --font-ui: ui-sans-serif, system-ui, sans-serif;
  }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 17px/1.6 var(--font-body);
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
  }
  .wrap {
    max-width: 40rem;
  }
  h1 {
    font-size: 1.45rem;
    margin: 0 0 .5rem;
    letter-spacing: .02em;
  }
  p {
    margin: .2rem 0;
    color: var(--ink-soft);
    font-family: var(--font-ui);
  }
  a {
    color: var(--oxblood);
  }
  .sr-only {
    position: absolute;
    left: -9999px;
  }
  .bar .fil{display:block;}
</style>

<body data-default-destination="about.html#data" data-api-destination="api.html">
  <div class="wrap" role="main">
    <h1>/data has moved</h1>
    <p>CityScroll now serves source-register details in the public <a href="about.html">about page</a>.</p>
    <p>API surfaces and live feed details live on <a href="api.html">api.html</a>.</p>
    <p>Source feed: <a href="https://data.cityofnewyork.us/d/dg92-zbpx" target="_blank" rel="noopener noreferrer">NYC Open Data (City Record)<span class="sr-only"> (opens in new tab)</span></a>.</p>
    <noscript>
      <p>Automatic redirect is disabled. Open <a href="about.html">about.html</a> or <a href="api.html">api.html</a>.</p>
    </noscript>
  </div>
  <script>
    function chartRows(rows, key, mode) {
      if (!mode) {
        mode = "ranking";
      }
      var values = rows.map(function (row) {
        return Number(row && row[key]) || 0;
      });

      var base = 0;
      if (mode === "composition") {
        base = values.reduce(function (sum, value) {
          return sum + value;
        }, 0);
      } else {
        base = Math.max.apply(Math, values.concat([1]));
      }

      return rows.map(function (row, index) {
        var value = values[index];
        var width = base > 0 ? (value / base) * 100 : 0;
        return {
          row: row,
          value: value,
          width: width,
          rounded: Math.round(width),
        };
      });
    }

    function bars(el, rows, labelKey, valueKey, fmt, mode) {
      var chart = chartRows(rows, valueKey, mode);
      var parts = [];

      for (var i = 0; i < chart.length; i++) {
        var item = chart[i];
        var label = item.row[labelKey];
        var value = item.value;
        var share = Math.round(item.width);
        var text;
        if (typeof fmt === "function") {
          text = fmt(value);
        } else {
          text = String(value);
        }
        if (mode === "composition") {
          if (typeof t === "function") {
            text = t("data_value_share", {
              value: text,
              share: share + "%",
            });
          } else {
            text = text + " · " + share + "%";
          }
        }
        parts.push(
          '<div class="bar-row">'
            + '<div>'
            + String(label)
            + '</div>'
            + '<div class="bar-value">'
            + text
            + '</div>'
            + '<div class="bar"><span class="fil" style="width:'
            + item.width
            + '%"></span></div>'
            + '</div>',
        );
      }

      el.innerHTML = parts.join("");
    }

    (function () {
      var target = document.body.dataset.defaultDestination;
      if (!target) return;

      if (location.search && location.search.length > 1) {
        var query = new URLSearchParams(location.search);
        if (query.get("dest") === "api" && document.body.dataset.apiDestination) {
          target = document.body.dataset.apiDestination;
        } else if (query.get("to") === "api" && document.body.dataset.apiDestination) {
          target = document.body.dataset.apiDestination;
        }
      }

      var destination = new URL(target, location.href);
      var params = new URLSearchParams(location.search);

      params.delete("dest");
      params.delete("to");

      var forwardedSearch = params.toString();
      if (forwardedSearch) {
        destination.search = forwardedSearch;
      }

      if (location.hash && !destination.hash) {
        destination.hash = location.hash;
      }

      var delayMs = 1200;
      setTimeout(function () {
        location.replace(destination.toString());
      }, delayMs);
    })();
  </script>
</body>
</html>
