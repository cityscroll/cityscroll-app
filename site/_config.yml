# Keep the generated public site limited to visitor-facing content and public
# project documentation. Source, tests, automation, and local guidance remain
# available in the repository without becoming Pages routes.
#
# A tracked data file that no route reads is excluded on the same grounds.
# data/procurement_browse_rows.json is the whole Contracts Browse projection:
# a small index over the bounded row shards under
# data/procurement_browse_rows_population/. Index and shards remain repository
# artifacts and builder inputs, but the read path is the bounded manifest, its
# query rows and the full-row shards that
# tools/build_shared_procurement_read_model.mjs writes beside them, so
# publishing them would ship a second and much larger copy of the same rows.
# data/ocp_awards_warehouse_lookup.json is the materialized award census the
# procurement builders and the Worker read model consume; no browser route or
# Pages handler fetches it, and a build-time refresh had already grown it to
# within a refresh of the Pages per-file guard.
# data/procurement_spine_sources.json is the acquisition spine the procurement,
# entity-intelligence and crosswalk builders read from the repository. It is a
# pure build input: no browser route, Pages handler or Worker endpoint fetches
# it, and the rows it carries reach readers through the shared procurement read
# model that is built from it. A build-time refresh grew the published copy past
# the Pages per-file guard, so it stays a repository artifact rather than a
# published one.
#
# The list below is parsed as consecutive "  - value" lines. A comment inside
# either list ends it, so keep prose here.
include:
  - _routes.json
  - _worker.js

exclude:
  - .agents
  - .claude
  - .github
  - .gitignore
  - AGENTS.md
  - CLAUDE.md
  - PAPERCUTS.md
  - backlog
  - data/ocp_awards_warehouse_lookup.json
  - data/procurement_browse_rows.json
  - data/procurement_browse_rows_population
  - data/procurement_spine_sources.json
  - data/source_health_observations.json
  - data/source_vintage_observations.json
  - data/source_vintage_alternates.json
  - experimental
  - internal
  - node_modules
  - tasks
  - test
  - tools
  - worker
