name: Build verified site artifact
description: Build the public artifact through the provider-neutral release script.

outputs:
  data-source-graph-dir:
    description: Directory containing the generated authenticated-desk graph artifacts.
    value: ${{ steps.build.outputs.data-source-graph-dir }}

inputs:
  source-dir:
    description: Repository checkout to build (supports the current site/ tree and legacy root layouts).
    required: false
    default: "."
  site-dir:
    description: Destination for the built artifact.
    required: false
    default: "_site"
  review-channel:
    description: Optional public review channel name.
    required: false
    default: ""
  commit-sha:
    description: Exact source commit represented by a review artifact.
    required: false
    default: ""
  refresh-decision-outcomes:
    description: Refresh bounded Land and meeting decision-outcome records.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node for generated artifacts
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build provider-neutral public artifact
      id: build
      shell: bash
      env:
        SOURCE_DIR: ${{ inputs.source-dir }}
        SITE_DIR: ${{ inputs.site-dir }}
        REVIEW_CHANNEL: ${{ inputs.review-channel }}
        COMMIT_SHA: ${{ inputs.commit-sha }}
        REFRESH_DECISION_OUTCOMES: ${{ inputs.refresh-decision-outcomes }}
      run: |
        set -euo pipefail
        args=(--source-dir "$SOURCE_DIR" --site-dir "$SITE_DIR")
        if [ "$REFRESH_DECISION_OUTCOMES" = "true" ]; then
          args+=(--refresh-decision-outcomes)
        fi
        if [ -n "$REVIEW_CHANNEL" ]; then
          args+=(--review-channel "$REVIEW_CHANNEL" --commit-sha "$COMMIT_SHA")
        fi
        node "$SOURCE_DIR/tools/build_cloudflare_pages.mjs" "${args[@]}"
