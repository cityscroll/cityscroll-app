name: Served artifact freshness

on:
  schedule:
    - cron: "25 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Build expected main artifact manifest
        uses: ./.github/actions/build-site
        with:
          site-dir: _site
      - name: Compare the served artifact with main
        id: probe
        env:
          CITYSCROLL_ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          set +e
          mkdir -p .artifacts
          findings="$(node tools/check_release_surface_reconciliation.mjs \
            --generation-receipt .artifacts/generation-output-receipt.json \
            --expected-manifest _site/artifact-manifest.json \
            --live-origin https://cityscroll.org \
            --required-stages generation_output,card_reconciliation,served_artifact_freshness \
            --output .artifacts/release-surface-receipt.json 2>&1)"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ -z "${CITYSCROLL_ADMIN_KEY:-}" ]; then
            echo "CITYSCROLL_ADMIN_KEY is required to deliver the freshness alarm" >&2
            echo "$findings" >&2
            exit "$status"
          fi
          FINDINGS="$findings" curl --fail-with-body --retry 2 -X POST "https://api.cityscroll.org/admin/ops-alert" \
            -H "authorization: Bearer $CITYSCROLL_ADMIN_KEY" \
            -H "content-type: application/json" \
            --data "$(FINDINGS="$findings" node -e 'console.log(JSON.stringify({guard:"served-artifact-freshness",stage:"served_artifact_freshness",findings:(process.env.FINDINGS||"The served artifact is stale or mismatched.").split(/\n/).filter(Boolean).slice(0,20),first_seen:new Date().toISOString(),last_seen:new Date().toISOString(),workflow_run_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,receipt_url:`${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}#artifacts`}))')"
          echo "$findings"
          exit 1
      - name: Retain freshness release-surface receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: served-artifact-freshness-${{ github.run_id }}
          path: .artifacts/release-surface-receipt.json
          if-no-files-found: warn
