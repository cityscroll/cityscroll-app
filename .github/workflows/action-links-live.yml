name: Live action-link integrity

on:
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-action-link-integrity
  cancel-in-progress: false

jobs:
  audit:
    name: Audit resident action links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Probe representative action-link patterns
        id: links
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/audit-action-links.mjs --live 2>&1 | tee action-link-integrity.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: action-link-integrity
          path: action-link-integrity.json
          retention-days: 30
      - name: Report action-link drift
        if: steps.links.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Outbound action-link integrity drift";
            const output = fs.readFileSync("action-link-integrity.json", "utf8").slice(-18000);
            const body = [
              "The scheduled action-link audit found a broken resident handoff.",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "```json",
              output,
              "```",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
      - name: Mark the scheduled audit failed
        if: always() && steps.links.outcome == 'failure'
        run: exit 1
