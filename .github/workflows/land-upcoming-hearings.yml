# Daily materialization of Land → Upcoming hearings from ZAP dispositions.
# Lists sell-facing Open Data project statuses, polite-fetches each project from
# the ZAP API, extracts venue/livestream/datetime, and fails if the product
# snapshot would contain synthetic rows.
#
# Publish loop: open/update a PR that commits the product snapshot + receipt
# (not upload-artifact-only). Pages/deploy consume the committed artifact;
# build_cloudflare_pages.mjs still runs --check (not --live).
name: Land upcoming hearings

on:
  schedule:
    # Daily 08:17 UTC — offset from attachment-metadata and digest windows
    - cron: "17 8 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Optional project cap (default all sell-facing, max 500)
        required: false
      polite_delay_ms:
        description: Polite delay between ZAP API requests (min 300)
        required: false
        default: "350"

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: land-upcoming-hearings
  cancel-in-progress: false

jobs:
  materialize:
    name: Sweep ZAP hearing logistics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Live materialization
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_DELAY: ${{ inputs.polite_delay_ms }}
        run: |
          set -euo pipefail
          args=(--live)
          if [[ -n "${INPUT_LIMIT:-}" ]]; then
            args+=(--limit "$INPUT_LIMIT")
          fi
          delay="${INPUT_DELAY:-350}"
          args+=(--polite-delay-ms "$delay")
          node tools/build_land_upcoming_hearings.mjs "${args[@]}"
          node tools/build_land_upcoming_hearings.mjs --check
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const path = "site/data/land_upcoming_hearings.json";
          const before = JSON.parse(execFileSync("git", ["show", `HEAD:${path}`], { encoding: "utf8" }));
          const after = JSON.parse(readFileSync(path, "utf8"));
          if (!(Date.parse(after.generated_at) > Date.parse(before.generated_at))) {
            throw new Error(`land upcoming-hearings generated_at did not advance (${before.generated_at} → ${after.generated_at})`);
          }
          NODE
      - name: Preserve product + receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: land-upcoming-hearings
          path: |
            site/data/land_upcoming_hearings.json
            warehouse/receipts/proof/land_upcoming_hearings_latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Guard generated changes
        id: generated
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Land upcoming hearings snapshot is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              site/data/land_upcoming_hearings.json) ;;
              warehouse/receipts/proof/land_upcoming_hearings_latest.json) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the upcoming-hearings pull request
        if: steps.generated.outputs.changed == 'true'
        id: refresh-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REFRESH_PR_TOKEN }}
          branch: automation/land-upcoming-hearings
          delete-branch: true
          commit-message: Refresh land upcoming hearings snapshot
          title: Refresh land upcoming hearings snapshot
          body: |
            Automated refresh of `site/data/land_upcoming_hearings.json` from the
            daily ZAP hearing-logistics sweep.

            Closes the compute-without-publish gap on card
            `cityscroll/land-zap-freshness-publish-loop`.

            Validation: `node tools/build_land_upcoming_hearings.mjs --check`
          add-paths: |
            site/data/land_upcoming_hearings.json
            warehouse/receipts/proof/land_upcoming_hearings_latest.json
      - name: Run required checks for the refresh pull request
        if: steps.refresh-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        run: gh workflow run ci.yml --ref automation/land-upcoming-hearings
      - name: Queue the verified refresh for merge
        if: steps.refresh-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
          REFRESH_PR: ${{ steps.refresh-pr.outputs.pull-request-number }}
          REFRESH_HEAD: ${{ steps.refresh-pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$REFRESH_PR" --auto --match-head-commit "$REFRESH_HEAD"
