# Deploys the Cloudflare Worker (api.cityscroll.org) whenever worker/ changes land on main,
# so the API ships in lockstep with the static site instead of waiting on a manual `wrangler
# deploy`. Code-only deploy: no secret puts, no [vars] overrides — see worker/README.md's
# "Automatic deploys" section for the vars-vs-secrets gotcha this intentionally avoids.
name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      # Apply pending D1 migrations before code deploy. CREATE TABLE IF NOT EXISTS migrations
      # are idempotent; skipping this left passport_* tables missing in production and turned
      # every PASSPort lifecycle lookup into lookup_status=error.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.110.0"
          command: d1 migrations apply crol-notices --remote
      # Wrangler rewrites Cron Trigger configuration on every deploy. Cloudflare says
      # trigger changes can take up to 15 minutes to propagate, so a deploy immediately
      # before 13:00 UTC can suppress that day's digest invocation.
      - name: Keep deploys clear of the digest cron
        run: node tools/wait_for_digest_cron_window.mjs
      - name: Deploy
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.110.0"
          # No accountId input: wrangler.toml carries no account_id, so wrangler resolves the
          # account from the API token itself — avoids a second repo secret to keep in sync.
          # No `secrets:` or `vars:` inputs on purpose — this deploys code only. Passing vars
          # here would clobber real secrets of the same name (see worker/README.md).

      # Idempotent single-secret sync for the authenticated Legistar Web API token. This is a
      # targeted `wrangler secret put` (NOT the action's bulk secrets/vars inputs that the
      # code-only deploy deliberately avoids). It only touches LEGISTAR_API_TOKEN, re-sets the
      # same value each deploy, and is non-fatal so a stale or missing secret never blocks a
      # code deploy. The value never appears in logs (env var piped to stdin via printf).
      - name: Sync Legistar API token secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LEGISTAR_API_TOKEN: ${{ secrets.LEGISTAR_API_TOKEN }}
        working-directory: worker
        run: |
          if [ -z "$LEGISTAR_API_TOKEN" ]; then echo "No LEGISTAR_API_TOKEN secret; skipping."; exit 0; fi
          printf '%s' "$LEGISTAR_API_TOKEN" | npx wrangler secret put LEGISTAR_API_TOKEN
        continue-on-error: true

  # Mirror / route deploys can break the public apex without failing wrangler.
  # Same live-URL gate as Deploy site: real content on both apex hosts + a deep
  # route, or the workflow fails with URL + status-chain diagnostics.
  smoke:
    name: Live URL smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./.github/actions/setup-playwright
      - name: Post-deploy live URL smoke
        run: node tools/live_url_smoke.mjs --timeout-ms 720000 --interval-ms 20000
      - name: Post-deploy project-connections API smoke
        run: node tools/project_connections_smoke.mjs --timeout-ms 720000 --interval-ms 20000
      - name: Post-deploy project-connections browser smoke
        env:
          CROL_BASE: https://cityscroll.org/
        run: python3 test/functional/27_project_connections_live.py
