# Deploys the Cloudflare Worker automatically when Worker code or a shared
# Following renderer source changes land on main. The manual trigger remains
# available for a re-run without a new commit.
# Code-only deploy: no secret puts, no [vars] overrides — see worker/README.md's
# "Automatic deploys" section for the vars-vs-secrets gotcha this intentionally avoids.
name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "capabilities/**"
      - "entity_resolution/**"
      - "ontology/**"
      - "site/**"
      - "tools/**"
      - "warehouse/**"
      - "site/data/district_activity.json"
      - "site/data/district_boundaries.json"
      - "site/data/shared_meeting_read_model.json"
      - "site/data/community_board_geography_lookup.json"
      - "site/following_view.mjs"
      - "site/data/watch_templates.json"
      - "site/data/following_procurement_suggestions.json"
      - "tools/build_worker_d1_read_models.mjs"
      - "tools/build_keyword_search_index.mjs"
      - "site/keyword_search_index_shards.mjs"
      - "tools/build_following_procurement_suggestions.mjs"
      - "tools/build_worker_route_read_models.mjs"
      - "tools/worker_deploy_guard.mjs"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      force_d1_publication:
        description: Publish D1 read models even when the deploy fingerprint is unchanged
        required: false
        default: false
        type: boolean

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - name: Install worker dependencies
        run: tools/install_worker_dependencies.sh
      - name: Verify Worker trigger coverage from dependency surface
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node tools/worker_trigger_coverage.mjs --check --output .artifacts/worker-trigger-coverage.json
          node tools/check_release_surface_reconciliation.mjs \
            --source-commit "$GITHUB_SHA" \
            --worker-coverage .artifacts/worker-trigger-coverage.json \
            --required-stages card_reconciliation,worker_trigger_coverage \
            --output .artifacts/release-surface-receipt.json
      - name: Build versioned Worker route read models
        run: node tools/build_worker_route_read_models.mjs --output-dir "$RUNNER_TEMP/cityscroll-worker-route-read-models" --check
      - name: Verify Worker bundle budget and route read-model canaries
        # worker_deploy_guard enforces the 64 MiB uncompressed budget, 10 MB compressed budget, and 1 second startup ceiling.
        # Keep the startup profiler on a Wrangler release whose bundled workerd supports the
        # Worker compatibility date; older alpha-check binaries can lag the Cloudflare runtime.
        working-directory: worker
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/cityscroll-worker-bundle"
          mkdir -p "$bundle_dir"
          npx wrangler@4.126.0 deploy --dry-run --outdir "$bundle_dir" --metafile "$bundle_dir/meta.json"
          npx wrangler@4.126.0 check startup > "$bundle_dir/startup.txt"
          node ../tools/worker_deploy_guard.mjs \
            --metafile "$bundle_dir/meta.json" \
            --startup-report "$bundle_dir/startup.txt" \
            --read-model-dir "$RUNNER_TEMP/cityscroll-worker-route-read-models" \
            --kv-dir "$RUNNER_TEMP/cityscroll-worker-route-read-models"
      - name: Compute D1 deploy fingerprint
        id: d1-deploy-fingerprint
        run: node tools/d1_deploy_fingerprint.mjs fingerprint --github-output "$GITHUB_OUTPUT"
      - name: Read last published D1 fingerprint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p .d1-publication-state
          if npx wrangler@4.126.0 kv key get d1-publication:state:v1 \
            --binding ALERT_STATE --remote --text --config worker/wrangler.toml \
            > .d1-publication-state/published.json; then
            echo "Last published D1 fingerprint loaded."
          else
            rm -f .d1-publication-state/published.json
            echo "Last published D1 fingerprint unavailable; publication will proceed."
          fi
      - name: Gate D1 publication
        id: d1-publication-gate
        env:
          FORCE_D1_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.force_d1_publication || false }}
        run: |
          node tools/d1_deploy_fingerprint.mjs decide \
            --fingerprint "${{ steps.d1-deploy-fingerprint.outputs.fingerprint }}" \
            --state .d1-publication-state/published.json \
            --force "$FORCE_D1_PUBLICATION" \
            --receipt .artifacts/d1-publication-receipt.json \
            --github-output "$GITHUB_OUTPUT"
          if grep -q '"reason": "fingerprint_unchanged"' .artifacts/d1-publication-receipt.json; then
            echo "D1 publication skipped: fingerprint_unchanged"
          fi
      - name: Snapshot D1 publication watermarks
        id: d1-partition-snapshot
        if: steps.d1-publication-gate.outputs.should-publish == 'true'
        run: node tools/d1_delta_plan.mjs snapshot --out .d1-publication-state/partition-snapshot.json
      - name: Claim D1 publication generation
        id: d1-generation-claim
        if: steps.d1-publication-gate.outputs.should-publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_FENCE_HOLDER: ${{ github.workflow }}:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node tools/d1_generation_fence.mjs claim \
            --fingerprint "${{ steps.d1-deploy-fingerprint.outputs.fingerprint }}" \
            --snapshot .d1-publication-state/partition-snapshot.json \
            --holder "$D1_FENCE_HOLDER" \
            --key d1-publication:state:v1 \
            --binding ALERT_STATE --remote --config worker/wrangler.toml \
            --receipt .artifacts/d1-generation-claim.json \
            --github-output "$GITHUB_OUTPUT"
          if grep -q '"claimed": false' .artifacts/d1-generation-claim.json; then
            echo "D1 generation fence is busy; this run will make no D1 writes."
          fi
      # Apply pending D1 migrations before code deploy. CREATE TABLE IF NOT EXISTS migrations
      # are idempotent; skipping this left passport_* tables missing in production and turned
      # every PASSPort lifecycle lookup into lookup_status=error.
      - name: Apply D1 migrations
        if: steps.d1-publication-gate.outputs.should-publish == 'true' && steps.d1-generation-claim.outputs.claimed == 'true'
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.126.0"
          command: d1 migrations apply crol-notices --remote
      # The compressed family shards are derived from the source projection. A
      # stale or tampered shard set must stop deployment before any D1 writes.
      - name: Verify keyword index source projection and shards
        run: node tools/build_keyword_search_index.mjs --check
      - name: Build D1 search, OCP, and entity-intelligence read models
        if: steps.d1-publication-gate.outputs.should-publish == 'true' && steps.d1-generation-claim.outputs.claimed == 'true'
        run: node tools/build_worker_d1_read_models.mjs --output-dir worker/.d1-read-models
      - name: Publish D1 search, OCP, and entity-intelligence read models
        id: d1-publication-sql
        if: steps.d1-publication-gate.outputs.should-publish == 'true' && steps.d1-generation-claim.outputs.claimed == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          D1_FENCE_HOLDER: ${{ github.workflow }}:${{ github.run_id }}:${{ github.run_attempt }}
          D1_FENCE_GENERATION: ${{ steps.d1-generation-claim.outputs.generation }}
        run: |
          set -euo pipefail
          abandon_fence() {
            node ../tools/d1_generation_fence.mjs abandon \
              --generation "$D1_FENCE_GENERATION" \
              --holder "$D1_FENCE_HOLDER" \
              --fingerprint "${{ steps.d1-deploy-fingerprint.outputs.fingerprint }}" \
              --key d1-publication:state:v1 \
              --binding ALERT_STATE --remote --config wrangler.toml \
              --receipt ../.artifacts/d1-generation-abandon.json || true
          }
          trap abandon_fence ERR
          node ../tools/d1_generation_fence.mjs commit-check \
            --generation "$D1_FENCE_GENERATION" \
            --holder "$D1_FENCE_HOLDER" \
            --fingerprint "${{ steps.d1-deploy-fingerprint.outputs.fingerprint }}" \
            --key d1-publication:state:v1 \
            --binding ALERT_STATE --remote --config wrangler.toml \
            --receipt ../.artifacts/d1-generation-commit.json \
            --github-output "$GITHUB_OUTPUT"
          if grep -q '"fenced": true' ../.artifacts/d1-generation-commit.json; then
            trap - ERR
            echo "D1 generation fence rejected this SQL boundary; no D1 writes started."
            echo "sql-started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "sql-started=true" >> "$GITHUB_OUTPUT"
          npx wrangler@4.126.0 d1 execute crol-notices --remote --yes --file .d1-read-models/keyword_search_read_model.sql
          node ../tools/d1_generation_fence.mjs renew \
            --generation "$D1_FENCE_GENERATION" --holder "$D1_FENCE_HOLDER" \
            --fingerprint "${{ steps.d1-deploy-fingerprint.outputs.fingerprint }}" \
            --key d1-publication:state:v1 --binding ALERT_STATE --remote --config wrangler.toml
          npx wrangler@4.126.0 d1 execute crol-notices --remote --yes --file .d1-read-models/ocp_awards_read_model.sql
          node ../tools/d1_generation_fence.mjs renew \
            --generation "$D1_FENCE_GENERATION" --holder "$D1_FENCE_HOLDER" \
            --fingerprint "${{ steps.d1-deploy-fingerprint.outputs.fingerprint }}" \
            --key d1-publication:state:v1 --binding ALERT_STATE --remote --config wrangler.toml
          npx wrangler@4.126.0 d1 execute crol-notices --remote --yes --file .d1-read-models/entity_intelligence_read_model.sql
          trap - ERR
      - name: Record published D1 fingerprint
        if: steps.d1-publication-gate.outputs.should-publish == 'true' && steps.d1-generation-claim.outputs.claimed == 'true' && steps.d1-publication-sql.outputs.sql-started == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          FORCE_D1_PUBLICATION: ${{ github.event_name == 'workflow_dispatch' && inputs.force_d1_publication || false }}
          D1_FENCE_HOLDER: ${{ github.workflow }}:${{ github.run_id }}:${{ github.run_attempt }}
          D1_FENCE_GENERATION: ${{ steps.d1-generation-claim.outputs.generation }}
        run: |
          node tools/d1_deploy_fingerprint.mjs mark-published \
            --fingerprint "${{ steps.d1-deploy-fingerprint.outputs.fingerprint }}" \
            --state .d1-publication-state/published.json \
            --receipt .artifacts/d1-publication-receipt.json \
            --force "$FORCE_D1_PUBLICATION" \
            --commands 4
          # The generation adapter performs the compare-and-set equivalent of
          # `wrangler kv key put d1-publication:state:v1` without overwriting a newer claim.
          node tools/d1_generation_fence.mjs complete \
            --generation "$D1_FENCE_GENERATION" \
            --holder "$D1_FENCE_HOLDER" \
            --fingerprint "${{ steps.d1-deploy-fingerprint.outputs.fingerprint }}" \
            --key d1-publication:state:v1 \
            --binding ALERT_STATE --remote --config worker/wrangler.toml \
            --receipt .artifacts/d1-generation-complete.json
          if grep -q '"completed": false' .artifacts/d1-generation-complete.json; then
            echo "D1 generation was fenced before publication completion."
            exit 1
          fi
      # D1 publication rollback: pause new delta publication and use the explicit rebuild path
      # (`node tools/build_worker_d1_read_models.mjs --mode rebuild`). Never delete fence state.
      # Route slices are immutable and versioned. Publish every slice first, then
      # publish the small manifests last so a live reader never follows a partial version.
      - name: Publish Near You and meeting route read models
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          route_dir="$RUNNER_TEMP/cityscroll-worker-route-read-models"
          for bulk_file in "$route_dir"/near-you.bulk.*.json "$route_dir"/meetings.bulk.*.json; do
            [ -f "$bulk_file" ] || continue
            npx wrangler@4.126.0 kv bulk put "$bulk_file" --binding ALERT_STATE --remote --config worker/wrangler.toml
          done
          npx wrangler@4.126.0 kv key put route-read-model:near-you:manifest:v1 \
            --path "$route_dir/near-you.manifest.json" --binding ALERT_STATE --remote --config worker/wrangler.toml
          npx wrangler@4.126.0 kv key put route-read-model:meetings:manifest:v1 \
            --path "$route_dir/meetings.manifest.json" --binding ALERT_STATE --remote --config worker/wrangler.toml
      # Wrangler rewrites Cron Trigger configuration on every deploy. Cloudflare says
      # trigger changes can take up to 15 minutes to propagate, so a deploy immediately
      # before 13:00 UTC can suppress that day's digest invocation.
      - name: Keep deploys clear of the digest cron
        run: node tools/wait_for_digest_cron_window.mjs
      - name: Deploy
        id: worker_deploy
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          wranglerVersion: "4.126.0"
          # No accountId input: wrangler.toml carries no account_id, so wrangler resolves the
          # account from the API token itself — avoids a second repo secret to keep in sync.
          # No `secrets:` or bulk `vars:` inputs — those would clobber real secrets of the
          # same name (see worker/README.md). `--var` injects only the health identity pair.
          command: deploy --var GIT_COMMIT_SHA:${{ github.sha }} --var WRANGLER_ENV:production

      - name: Record Worker provider and publication evidence
        if: always()
        run: |
          set -euo pipefail
          node tools/update_release_surface_receipt.mjs \
            --receipt .artifacts/release-surface-receipt.json \
            --stage worker_release \
            --status UNKNOWN \
            --required-stage worker_release \
            --reason "Cloudflare Workers provider/build identity was not emitted by the deploy action" \
            --evidence-file .artifacts/worker-trigger-coverage.json
          node tools/update_release_surface_receipt.mjs \
            --receipt .artifacts/release-surface-receipt.json \
            --stage data_publication \
            --status UNKNOWN \
            --required-stage data_publication \
            --reason "D1/KV publication versions were not emitted as one transaction receipt"
      - name: Write Worker deployment-health receipt
        if: always()
        env:
          DEPLOYMENT_OUTCOME: ${{ steps.worker_deploy.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/deployment-health
          node tools/check_deployment_health.mjs --write \
            --boundary cloudflare-worker \
            --pipeline deploy-worker \
            --merged-source-sha "$GITHUB_SHA" \
            --deployed-commit-sha "$GITHUB_SHA" \
            --artifact-type worker-commit \
            --artifact-value "$GITHUB_SHA" \
            --deployment-id "cityscroll-worker@${GITHUB_SHA}" \
            --deployment-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --provider-status "$DEPLOYMENT_OUTCOME" \
            --trigger-coverage .artifacts/worker-trigger-coverage.json \
            --guard wrangler_worker_deploy:"$DEPLOYMENT_OUTCOME" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output .artifacts/deployment-health/cloudflare-worker.json
      - name: Retain Worker release-surface receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-worker-release-evidence
          path: |
            .artifacts/release-surface-receipt.json
            .artifacts/worker-trigger-coverage.json
            .artifacts/d1-publication-receipt.json
            .artifacts/deployment-health/cloudflare-worker.json
          if-no-files-found: warn

      # The RUM query is intentionally separate from the write binding. Reuse the existing
      # deployment token, whose account permissions include Analytics Engine read, for the Worker
      # read binding. An absent binding must remain visible as an unavailable read path rather than
      # being mistaken for an empty dataset.
      - name: Sync Analytics Engine read token secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not configured; /admin/performance will remain unavailable."
            exit 0
          fi
          printf '%s' "$CLOUDFLARE_API_TOKEN" | npx wrangler@4.126.0 secret put ANALYTICS_READ_TOKEN

      # Idempotent single-secret sync for the authenticated Legistar Web API token. This is a
      # targeted `wrangler secret put` (NOT the action's bulk secrets/vars inputs that the
      # code-only deploy deliberately avoids). It only touches LEGISTAR_API_TOKEN, re-sets the
      # same value each deploy, and is non-fatal so a stale or missing secret never blocks a
      # code deploy. The value never appears in logs (env var piped to stdin via printf).
      - name: Sync Legistar API token secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LEGISTAR_API_TOKEN: ${{ secrets.LEGISTAR_API_TOKEN }}
        working-directory: worker
        run: |
          if [ -z "$LEGISTAR_API_TOKEN" ]; then echo "No LEGISTAR_API_TOKEN secret; skipping."; exit 0; fi
          printf '%s' "$LEGISTAR_API_TOKEN" | npx wrangler secret put LEGISTAR_API_TOKEN
        continue-on-error: true

  # Mirror / route deploys can break the public apex without failing wrangler.
  # Same live-URL gate as Deploy site: real content on both apex hosts + a deep
  # route, or the workflow fails with URL + status-chain diagnostics.
  smoke:
    name: Live URL smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - uses: ./.github/actions/setup-playwright
      - name: Install worker dependencies
        # Needed only for the CS-10 canary below, which uses the pinned
        # @modelcontextprotocol/sdk client from worker/node_modules.
        run: tools/install_worker_dependencies.sh
      - name: CS-10 · Live MCP endpoint canary
        # Crosses public DNS to the just-deployed production MCP endpoint:
        # initialize, tools/list against the generated deployed inventory,
        # ping, one bounded static read, one bounded D1-backed read, and one
        # deliberately invalid call. A failure here — including tool-inventory
        # drift — fails this workflow run; see test/live_mcp_canary.test.mjs.
        run: node --test test/live_mcp_canary.test.mjs
      - name: Post-deploy live URL smoke
        run: node tools/live_url_smoke.mjs --timeout-ms 720000 --interval-ms 20000
      - name: Post-deploy project-connections API smoke
        run: node tools/project_connections_smoke.mjs --timeout-ms 720000 --interval-ms 20000
      - name: Post-deploy project-connections browser smoke
        env:
          CROL_BASE: https://cityscroll.org/
          # Keep deploy conclusions tied to a committed read-model canary. The
          # script's default exercises a live fallback in scheduled monitoring.
          CROL_PROJECT_CONNECTIONS_ID: "2022M0258"
        run: python3 test/functional/27_project_connections_live.py
      - name: Post-deploy Following create-first contract
        env:
          CROL_BASE: https://cityscroll.org/
          CROL_DEMO_LINK_IDS: alerts-builder
        run: python3 test/functional/20_demo_links.py
