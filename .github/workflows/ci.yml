# CI — the integration safety net (issue #1, PR A0).
# Unit layers run on every PR and push to main; the Playwright functional layer is
# heavier (headless Chromium + live open-data APIs) so it runs on manual dispatch
# until it proves stable in CI.
name: CI

on:
  pull_request:
    # Machine changelog data commits do not need the pull-request suite.
    paths-ignore:
      - site/changelog-data.json
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      # Browser performance contract only (home + contracts keyword). Narrower than
      # frontend: site/data receipts, worker-only, and docs do not trigger the
      # 20-sample p95 job. Real chrome/asset changes still do.
      perf: ${{ steps.filter.outputs.perf }}
      worker: ${{ steps.filter.outputs.worker }}
      docs: ${{ steps.filter.outputs.docs }}
      # true only when every changed path is the machine changelog data contract.
      # Used so required checks
      # still report SUCCESS on changelog-only PRs without running the full suite —
      # otherwise path filters + skipped jobs leave the merge queue waiting forever.
      changelog_only: ${{ steps.path_class.outputs.changelog_only }}
      # true when every path is docs/** or top-level Markdown (see tools/docs-only-path-guard.sh).
      docs_only: ${{ steps.path_class.outputs.docs_only }}
      # true when the full unit/standards suite must run (neither changelog nor docs-only).
      unit_full: ${{ steps.path_class.outputs.unit_full }}
    steps:
      # Checkout is required for merge_group, push, workflow_dispatch, and for the
      # changelog path-guard script; pull_request file lists still come from the API.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # workflow_dispatch / push have no PR file list; without `base`, dorny
          # treats every filter as true and would skip the changelog_only fast path.
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'merge_group' && github.event.merge_group.base_sha || 'main') }}
          filters: |
            frontend:
              - 'site/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/build-site/**'
              - '.github/actions/setup-playwright/**'
              - '.github/workflows/deploy-pages.yml'
              - '.github/workflows/deploy-beta-preview.yml'
              - '.github/workflows/promote-beta.yml'
            # Subset of frontend that can move the static 20-sample budget.
            # Excludes site/data/** (receipts, join JSON), pure Markdown under site/,
            # and deploy workflow metadata that a11y still wants as frontend.
            perf:
              - 'site/**/*.html'
              - 'site/**/*.css'
              - 'site/**/*.js'
              - 'site/**/*.mjs'
              - 'site/**/*.svg'
              - 'site/**/*.png'
              - 'site/**/*.jpg'
              - 'site/**/*.jpeg'
              - 'site/**/*.webp'
              - 'site/**/*.woff'
              - 'site/**/*.woff2'
              - 'site/assets/**'
              - 'site/media/**'
              - 'site/i18n/**'
              - 'performance-budgets.json'
              - 'test/performance/**'
              - '.github/actions/setup-playwright/**'
            worker:
              - 'worker/**'
            docs:
              - 'docs/**'
              - '*.md'
      - name: Classify path set (changelog_only / docs_only / unit_full)
        id: path_class
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              mapfile -t files < <(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename')
              ;;
            merge_group)
              mapfile -t files < <(git diff --name-only "${{ github.event.merge_group.base_sha }}" "${{ github.event.merge_group.head_sha }}")
              ;;
            *)
              git fetch origin main --depth=50
              mapfile -t files < <(git diff --name-only "origin/main...HEAD" || git diff --name-only origin/main HEAD)
              ;;
          esac
          echo "Changed paths (${#files[@]}):"
          printf '  %s\n' "${files[@]}"
          changelog_only=false
          docs_only=false
          if printf '%s\n' "${files[@]}" | bash tools/changelog-path-guard.sh; then
            changelog_only=true
            echo "Changelog-only path set — required checks will take the fast path."
          elif printf '%s\n' "${files[@]}" | bash tools/docs-only-path-guard.sh; then
            docs_only=true
            echo "Docs-only path set — unit suite and browser gates take the fast path."
          fi
          if [ "$changelog_only" = true ] || [ "$docs_only" = true ]; then
            unit_full=false
          else
            unit_full=true
          fi
          {
            echo "changelog_only=${changelog_only}"
            echo "docs_only=${docs_only}"
            echo "unit_full=${unit_full}"
          } >> "$GITHUB_OUTPUT"

  public-image-guard:
    name: Public image capture guard
    if: github.event.repository.visibility == 'public' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Collect added images from the diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate -q '.[] | select(.status == "added") | .filename' > "$RUNNER_TEMP/added-images.txt"
          else
            git diff --name-only --diff-filter=A "${{ github.event.merge_group.base_sha }}" "${{ github.event.merge_group.head_sha }}" > "$RUNNER_TEMP/added-images.txt"
          fi
          echo "Added paths:"; sed 's/^/  /' "$RUNNER_TEMP/added-images.txt" || true
      - name: Run focused guard tests
        run: python3 -m unittest discover -s test -p 'desk_capture_guard_test.py'
      - name: Check added images
        run: python3 tools/check_public_image_captures.py --paths-file "$RUNNER_TEMP/added-images.txt"

  # The matrix owns the hosted test commands; the aggregate below keeps the existing
  # required status context and validates that every expected family produced a receipt.
  unit-family:
    name: Unit family (${{ matrix.family }})
    needs: changes
    if: needs.changes.outputs.unit_full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: [static-standards, site-node, contract, worker]
    steps:
      - name: Start Unit family timer
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-family-${{ matrix.family }}"
          date +%s > "$RUNNER_TEMP/unit-family-${{ matrix.family }}/started_epoch"

      # Each matrix entry gets the same checkout and Node setup before its family-specific
      # commands. Worker dependencies stay scoped to the Worker family, as in the serial job.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Beta preview alias contract
        if: matrix.family == 'static-standards' && github.event_name == 'pull_request'
        run: node tools/check_beta_review_contract.mjs
      - name: Expiring beta flag contract
        if: matrix.family == 'static-standards'
        run: node tools/validate_beta_flags.mjs
      - name: Generated source-contract docs
        if: matrix.family == 'static-standards'
        run: |
          node tools/generate_source_docs.mjs --check
          node tools/data_source_graph.mjs
          node tools/data_source_graph.mjs --check
      - name: Recorded civic-data source contracts
        if: matrix.family == 'static-standards'
        # Pull-request CI is deterministic. The daily source-contract workflow owns live
        # upstream checks and opens an issue when a publisher drifts.
        run: node tools/verify_source_contracts.mjs
      - name: Depot re-derivation drift gate
        if: matrix.family == 'static-standards'
        # Gauge-fired on PR/push (never cron). Re-derives the join graph from the committed
        # source-contract measurements + gap taxonomy; fails if the registry is stale so an
        # ingest PR must carry its own depot refresh. Writes nothing in CI.
        run: node tools/depot_rederive.mjs --check
      - name: Script syntax gate (all pages + i18n.js)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/js_syntax.py
      - name: i18n key parity
        if: matrix.family == 'static-standards'
        run: python3 test/standards/i18n_keys.py
      - name: i18n reference + cache-skew gate
        if: matrix.family == 'static-standards'
        run: python3 test/standards/i18n_refs.py
      - name: i18n static-fallback sync gate (fallback text vs. en dictionary)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/i18n_fallback_sync.py
      - name: Stray-English static lint
        if: matrix.family == 'static-standards'
        run: python3 test/standards/stray_english.py
      - name: Spanish diacritics gate
        if: matrix.family == 'static-standards'
        run: python3 test/standards/es_diacritics.py
      - name: i18n glossary + placeholder-parity gate
        if: matrix.family == 'static-standards'
        run: python3 test/standards/i18n_glossary.py
      - name: Attribution-presence gate (open-data citation, LL11/2012)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/attribution.py
      - name: Descriptive-link-text lint (NYC Web Content Style Guide)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/link_text.py
      - name: Static outline:none guard (focus-visible companion)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/outline_guard.py
      - name: Form-control border contrast gate (WCAG 1.4.11)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/form_border_contrast.py
      - name: Civic token and legacy-palette contract
        if: matrix.family == 'static-standards'
        run: python3 test/standards/civic_token_contract.py
      - name: NYC copy lint (NYC Web Content Style Guide)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/nyc_copy_lint.py --gate
      - name: Public-surface internal-vocabulary lint
        if: matrix.family == 'static-standards'
        run: python3 test/standards/public_surface_vocab.py --gate
      - name: Claim-first prediction lint
        if: matrix.family == 'static-standards'
        run: python3 test/standards/claim_first_prediction.py
      - name: Public payload integrity
        if: matrix.family == 'static-standards'
        run: node tools/check_public_payload_integrity.mjs
      - name: Descriptive collapsed-group labels
        if: matrix.family == 'static-standards'
        run: node tools/check-collapsed-group-labels.mjs
      - name: Page-metadata gate (meta description length, title format)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/page_metadata.py
      - name: CityScroll brand, SVG, and icon-family gate
        if: matrix.family == 'static-standards'
        run: python3 test/standards/brand_identity.py
      - name: Non-affiliation gate (no official marks or claims)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/no_official_marks.py
      - name: CityScroll canonical-domain contract
        if: matrix.family == 'static-standards'
        run: python3 test/standards/canonical_domain.py
      - name: External-link presentation gate (same-tab, no link icons)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/link_targets.py
      - name: Heading-punctuation lint (NYC Web Content Style Guide)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/heading_punctuation.py
      - name: GenAI content-disclosure presence gate
        if: matrix.family == 'static-standards'
        run: python3 test/standards/genai_disclosure.py
      - name: NL-input clarity gate (quiz keyword field vs. Ask box, parsed-chip status label)
        if: matrix.family == 'static-standards'
        run: python3 test/standards/nl_input_clarity.py
      - name: Public demo-link manifest schema
        if: matrix.family == 'static-standards'
        run: python3 test/standards/demo_links.py
      - name: Test-clock auditor (reject un-injected new Date()/Date.now() in tests)
        if: matrix.family == 'static-standards'
        # Local preflight already runs this; promote into CI so a skipped preflight
        # cannot land a date-boundary flake class that only fails at UTC midnight.
        run: node tools/audit-test-clocks.mjs
      - name: Accessibility gate regression proof
        if: matrix.family == 'static-standards'
        run: python3 test/functional/a11y_gate_test.py
      - name: Route timeout diagnostics regression proof
        if: matrix.family == 'static-standards'
        run: python3 test/functional/ci_waits_test.py

      - name: Site unit tests
        if: matrix.family == 'site-node'
        # Scoped to test/ — a bare `node --test` also recurses into worker/test/,
        # which needs worker/node_modules (installed in the next step).
        run: node --test test/*.test.mjs
      - name: Resident-read zero-egress architecture gate
        if: matrix.family == 'site-node'
        run: node tools/no_live_external_reads.mjs --check
      - name: Preset snapshot receipt is internally consistent
        if: matrix.family == 'site-node'
        run: node tools/validate_presets.mjs --check --offline

      - name: Site/worker contract tests (drift guard — see docs/drift-inventory.md)
        if: matrix.family == 'contract'
        # test/contract/*.test.mjs imports worker/src/lib/*.mjs modules directly (all
        # dependency-free — no worker/node_modules needed) alongside functions extracted from
        # index.html, and runs one shared fixture set through both. A change that makes either
        # side disagree with the other on the same input fails here, not in production.
        run: node --test test/contract/*.test.mjs
      - name: Worker dependencies
        if: matrix.family == 'worker'
        run: npm ci
        working-directory: worker
      - name: Worker unit tests
        if: matrix.family == 'worker'
        run: node --test
        working-directory: worker

      - name: Write Unit family timing receipt
        if: always()
        run: |
          set -euo pipefail
          family_dir="$RUNNER_TEMP/unit-family-${{ matrix.family }}"
          started_epoch="$(<"$family_dir/started_epoch")"
          finished_epoch="$(date +%s)"
          python3 - "$family_dir/${{ matrix.family }}.timing.json" "$started_epoch" "$finished_epoch" <<'PY'
          import json
          import sys

          path, started, finished = sys.argv[1:]
          payload = {
              "schema": "cityscroll.unit-family-timing.v1",
              "family": path.rsplit("/", 1)[-1].removesuffix(".timing.json"),
              "started_epoch": int(started),
              "finished_epoch": int(finished),
              "duration_seconds": int(finished) - int(started),
          }
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Upload Unit family timing receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-family-${{ matrix.family }}-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/unit-family-${{ matrix.family }}/${{ matrix.family }}.timing.json
          if-no-files-found: error
          retention-days: 1

  unit:
    name: Unit tests (site + worker)
    needs: [changes, unit-family]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Required check name must always report SUCCESS/FAILURE (never stay missing).
      # Changelog-only and docs-only diffs take a no-op SUCCESS path so the merge
      # queue never waits on skipped check names (same contract as Agents.md).
      - name: Changelog-only or docs-only — report required check success
        if: needs.changes.outputs.unit_full != 'true'
        run: |
          if [ "${{ needs.changes.outputs.changelog_only }}" = "true" ]; then
            echo "Only site/changelog-data.json changed."
          else
            echo "Docs-only path set (docs/** and/or top-level Markdown)."
          fi
          echo "Reporting success for 'Unit tests (site + worker)' without the full suite."
      - name: Download Unit family timing receipts
        if: always() && needs.changes.outputs.unit_full == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: unit-family-*-timing-${{ github.run_id }}-${{ github.run_attempt }}
          path: unit-family-timings
          merge-multiple: true
          if-no-artifact-found: error
      - name: Report Unit family wall span
        if: always() && needs.changes.outputs.unit_full == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import statistics

          expected = {"static-standards", "site-node", "contract", "worker"}
          receipts = sorted(pathlib.Path("unit-family-timings").glob("*.timing.json"))
          parsed = [json.loads(path.read_text(encoding="utf-8")) for path in receipts]
          actual = {item.get("family") for item in parsed}
          if len(parsed) != len(expected) or actual != expected:
              missing = sorted(expected - actual)
              unexpected = sorted(actual - expected)
              raise SystemExit(
                  f"missing or unexpected Unit family timing receipts: missing={missing}, unexpected={unexpected}"
              )
          spans = [item["duration_seconds"] for item in parsed]
          wall_span = max(item["finished_epoch"] for item in parsed) - min(item["started_epoch"] for item in parsed)
          message = (
              f"Unit family wall span: {wall_span}s; "
              f"family p50={statistics.median(spans):.1f}s, p95={max(spans):.1f}s."
          )
          print(message)
          with pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write(f"### Unit family timing\n\n{message}\n")
          PY
      - name: Fail when a Unit family fails or is missing
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.unit-family.result != 'success'
        run: |
          echo "Unit family aggregate is not green: ${{ needs.unit-family.result }}"
          exit 1
      - name: Report all Unit families green
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.unit-family.result == 'success'
        run: echo "All Unit families passed."

  internal-path-guard:
    name: Internal-path guard
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Guard PR/merge-group path changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed_paths=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            mapfile -t changed_paths < <(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[] | select(.status != "removed") | .filename')
          else
            mapfile -t changed_paths < <(git diff --name-only --diff-filter=AMR "${{ github.event.merge_group.base_sha }}" "${{ github.event.merge_group.head_sha }}")
          fi
          printf '%s\n' "${changed_paths[@]}" | bash tools/internal-path-guard.sh

  # The serial control and deterministic raw-sample matrix consume the same verified
  # site artifact. The control is evidence only; the aggregate below owns the budget gate.
  performance-serial:
    name: Performance serial baseline (pilot)
    needs: [changes, unit, browser-pr-site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Performance serial fast path
        if: needs.changes.outputs.unit_full != 'true' || needs.changes.outputs.perf != 'true' || needs.unit.result != 'success'
        run: echo "No serial performance baseline is needed for this path set."
      - name: Fail when the shared site artifact is unavailable
        if: needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result != 'success'
        run: |
          echo "The shared verified browser site artifact job did not succeed: ${{ needs.browser-pr-site.result }}"
          exit 1
      - uses: actions/checkout@v4
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        with:
          persist-credentials: false
      - name: Download shared verified site artifact
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: browser-pr-site-${{ github.run_id }}
          path: .
      - name: Verify shared site artifact checksums
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        run: sha256sum --strict -c _site.sha256
      - uses: ./.github/actions/setup-playwright
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        with:
          playwright-version: "1.58.0"
      - name: Run serial 20-sample control
        id: serial-control
        continue-on-error: true
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/performance-serial"
          mkdir -p "$receipt_dir"
          started_epoch="$(date +%s)"
          status=0
          python3 test/performance/verify.py \
            --budgets performance-budgets.json \
            --fixtures test/performance/fixtures \
            --site-root _site \
            --samples 20 \
            --output "$receipt_dir/serial-results.json" || status=$?
          finished_epoch="$(date +%s)"
          python3 - "$receipt_dir/serial-timing.json" "$started_epoch" "$finished_epoch" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          started = int(sys.argv[2])
          finished = int(sys.argv[3])
          path.write_text(json.dumps({
              "started_epoch": started,
              "finished_epoch": finished,
              "duration_seconds": finished - started,
          }, indent=2) + "\n", encoding="utf-8")
          PY
          exit "$status"
      - name: Preserve serial baseline and wall span
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: performance-serial-${{ github.run_id }}
          path: ${{ runner.temp }}/performance-serial
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  performance-shard:
    name: Performance raw samples (shard ${{ matrix.shard }})
    needs: [changes, unit, browser-pr-site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Performance shard fast path
        if: needs.changes.outputs.unit_full != 'true' || needs.changes.outputs.perf != 'true' || needs.unit.result != 'success'
        run: echo "No performance samples are needed for this path set."
      - name: Fail when the shared site artifact is unavailable
        if: needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result != 'success'
        run: |
          echo "The shared verified browser site artifact job did not succeed: ${{ needs.browser-pr-site.result }}"
          exit 1
      - uses: actions/checkout@v4
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        with:
          persist-credentials: false
      - name: Download shared verified site artifact
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: browser-pr-site-${{ github.run_id }}
          path: .
      - name: Verify shared site artifact checksums
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        run: sha256sum --strict -c _site.sha256
      - uses: ./.github/actions/setup-playwright
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        with:
          playwright-version: "1.58.0"
      - name: Collect deterministic raw sample shard
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        run: |
          set -euo pipefail
          receipt_dir="$RUNNER_TEMP/performance-shard-${{ matrix.shard }}"
          mkdir -p "$receipt_dir"
          python3 test/performance/verify.py \
            --budgets performance-budgets.json \
            --fixtures test/performance/fixtures \
            --site-root _site \
            --samples 20 \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            --output "$receipt_dir/shard-${{ matrix.shard }}.json"
      - name: Preserve raw sample shard
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: performance-raw-${{ matrix.shard }}-${{ github.run_id }}
          path: ${{ runner.temp }}/performance-shard-${{ matrix.shard }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  performance:
    name: Performance budgets (20-sample p95)
    # This aggregate remains outside merge rules (see tools/merge_queue_policy.json).
    # It reports a conclusion on every path set and calculates p95 only after all 20
    # raw samples are present; shard percentiles are never calculated or averaged.
    needs: [changes, unit, browser-pr-site, performance-serial, performance-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Non-perf path set or unit-failed — report success
        if: needs.changes.outputs.unit_full != 'true' || needs.changes.outputs.perf != 'true' || needs.unit.result != 'success'
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] && \
             [ "${{ needs.changes.outputs.unit_full }}" = "true" ] && \
             [ "${{ needs.changes.outputs.perf }}" = "true" ]; then
            echo "Skipping 20-sample performance budget because unit failed — re-run after unit is green."
          else
            echo "Skipping 20-sample performance budget (unit_full=${{ needs.changes.outputs.unit_full }}, perf=${{ needs.changes.outputs.perf }}, frontend=${{ needs.changes.outputs.frontend }})."
          fi
          echo "Reporting success for 'Performance budgets (20-sample p95)' without measuring."
      - name: Fail when performance pilot inputs are unavailable
        if: needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success' && (needs.browser-pr-site.result != 'success' || needs.performance-serial.result != 'success' || needs.performance-shard.result != 'success')
        run: |
          echo "Performance inputs are incomplete: site=${{ needs.browser-pr-site.result }}, serial=${{ needs.performance-serial.result }}, shards=${{ needs.performance-shard.result }}"
          exit 1
      - uses: actions/checkout@v4
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success'
        with:
          persist-credentials: false
      - name: Download raw sample shards
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: performance-raw-*-${{ github.run_id }}
          path: ${{ runner.temp }}/performance-shards
          merge-multiple: true
      - name: Download serial baseline
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: performance-serial-${{ github.run_id }}
          path: ${{ runner.temp }}/performance-serial
      - name: Aggregate the complete raw sample set
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success'
        run: |
          python3 test/performance/aggregate.py \
            --budgets performance-budgets.json \
            --shards-dir "$RUNNER_TEMP/performance-shards" \
            --serial-results "$RUNNER_TEMP/performance-serial/serial-results.json" \
            --serial-timing "$RUNNER_TEMP/performance-serial/serial-timing.json" \
            --output test/performance/artifacts/results.json \
            --pilot-output test/performance/artifacts/pilot.json \
            --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Preserve aggregated performance samples
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: performance-samples
          path: test/performance/artifacts/results.json
          if-no-files-found: error
          overwrite: true
      - name: Preserve parallelism pilot receipt
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.perf == 'true' && needs.unit.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: performance-parallelism-pilot
          path: test/performance/artifacts/pilot.json
          if-no-files-found: error
          overwrite: true

  # w7-01: promotes the axe gate + language gate to every PR. The required job below
  # keeps its existing public name, while the browser/reader checks run in parallel behind
  # it. All shards consume one verified _site artifact and bind their own OS-assigned port.
  a11y-pr:
    name: Accessibility + language gate (axe on every PR)
    needs: [changes, unit, a11y-pr-shard, a11y-routes-focus-primary, a11y-routes-focus-retry]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Changelog-only, non-frontend, or unit-failed — report required check success
        if: always() && (needs.changes.outputs.unit_full != 'true' || needs.changes.outputs.frontend != 'true' || needs.unit.result != 'success')
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] && \
             [ "${{ needs.changes.outputs.unit_full }}" = "true" ] && \
             [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            echo "Skipping heavy a11y suite because unit failed — re-run after unit is green."
          else
            echo "Skipping heavy a11y suite (unit_full=${{ needs.changes.outputs.unit_full }}, frontend=${{ needs.changes.outputs.frontend }})."
          fi
          echo "Reporting success for 'Accessibility + language gate (axe on every PR)'."
      - name: Fail when an accessibility shard fails or is missing
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && (needs.a11y-pr-shard.result != 'success' || (needs.a11y-routes-focus-primary.result != 'success' && needs.a11y-routes-focus-retry.result != 'success'))
        run: |
          echo "Accessibility matrix result: ${{ needs.a11y-pr-shard.result }}"
          echo "Routes-focus primary result: ${{ needs.a11y-routes-focus-primary.result }}"
          echo "Routes-focus fresh-runner retry result: ${{ needs.a11y-routes-focus-retry.result }}"
          exit 1
      - name: Report all accessibility shards green
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.a11y-pr-shard.result == 'success' && (needs.a11y-routes-focus-primary.result == 'success' || needs.a11y-routes-focus-retry.result == 'success')
        run: |
          # `needs` does not resolve until every matrix child and its final artifact
          # upload step completes. Keep the required verdict on that job result: a
          # second artifact-list query here is eventually consistent and can make a
          # successful matrix stale-red, especially after a failed-job-only rerun.
          if [[ "${{ needs.a11y-routes-focus-primary.result }}" != "success" ]]; then
            echo "Routes-focus recovered on its one fresh-runner retry."
            {
              echo "### Accessibility route recovery"
              echo "The routes-focus primary failed and the bounded fresh-runner retry passed."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "All accessibility and language shards passed and published evidence."
          fi

  # Build once so accessibility and performance shards test the exact same generated artifact.
  browser-pr-site:
    name: Shared browser site artifact
    needs: [changes, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Browser artifact fast path
        if: always() && (needs.changes.outputs.unit_full != 'true' || (needs.changes.outputs.frontend != 'true' && needs.changes.outputs.perf != 'true') || needs.unit.result != 'success')
        run: echo "No browser site artifact is needed for this path set."
      - uses: actions/checkout@v4
        if: always() && needs.changes.outputs.unit_full == 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.perf == 'true') && needs.unit.result == 'success'
        with:
          persist-credentials: false
      - name: Build verified site artifact
        if: always() && needs.changes.outputs.unit_full == 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.perf == 'true') && needs.unit.result == 'success'
        uses: ./.github/actions/build-site
      - name: Verify site artifact checksums
        if: always() && needs.changes.outputs.unit_full == 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.perf == 'true') && needs.unit.result == 'success'
        run: |
          set -euo pipefail
          test -d _site
          find _site -type f -print0 | sort -z | xargs -0 sha256sum > _site.sha256
          test -s _site.sha256
      - name: Upload shared verified site artifact
        if: always() && needs.changes.outputs.unit_full == 'true' && (needs.changes.outputs.frontend == 'true' || needs.changes.outputs.perf == 'true') && needs.unit.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          # Keep the handoff stable when "rerun failed jobs" advances run_attempt
          # without rerunning this already-successful producer job.
          name: browser-pr-site-${{ github.run_id }}
          path: |
            _site
            _site.sha256
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  # The matrix is deliberately not required by branch protection. Only a11y-pr above is
  # required, so queue admission sees one all-green verdict while every shard remains visible.
  a11y-pr-shard:
    name: Accessibility + language shard (${{ matrix.shard }})
    needs: [changes, unit, browser-pr-site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [browser-a11y, language-layout, rendered-census]
    steps:
      - name: Accessibility shard fast path
        if: always() && (needs.changes.outputs.unit_full != 'true' || needs.changes.outputs.frontend != 'true' || needs.unit.result != 'success')
        run: echo "No frontend accessibility shard is needed for this path set."
      - name: Fail when the shared site artifact is unavailable
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result != 'success'
        run: |
          echo "The shared verified browser site artifact job did not succeed: ${{ needs.browser-pr-site.result }}"
          exit 1
      - uses: actions/checkout@v4
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        with:
          persist-credentials: false
      - name: Download shared verified site artifact
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: browser-pr-site-${{ github.run_id }}
          path: .
      - name: Verify shared site artifact checksums
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        run: sha256sum --strict -c _site.sha256
      - uses: ./.github/actions/setup-playwright
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
      - name: Run isolated accessibility shard
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        env:
          NO_DISCLAIMER_SLOP_MODE: ${{ vars.NO_DISCLAIMER_SLOP_MODE || 'warn' }}
        run: tools/run_a11y_ci_shard.sh "${{ matrix.shard }}" primary
      - name: Upload shard result evidence
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          # Evidence publication is part of the shard result. Stable run-scoped names
          # survive failed-job-only reruns; a full shard rerun replaces its own receipt.
          name: a11y-pr-shard-${{ matrix.shard }}-primary-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/a11y-pr-shard-${{ matrix.shard }}-primary-logs
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  a11y-routes-focus-primary:
    name: Accessibility + language shard (routes-focus primary)
    needs: [changes, unit, browser-pr-site]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Routes-focus fast path
        if: always() && (needs.changes.outputs.unit_full != 'true' || needs.changes.outputs.frontend != 'true' || needs.unit.result != 'success')
        run: echo "No frontend routes-focus shard is needed for this path set."
      - name: Fail when the shared site artifact is unavailable
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result != 'success'
        run: |
          echo "The shared verified browser site artifact job did not succeed: ${{ needs.browser-pr-site.result }}"
          exit 1
      - uses: actions/checkout@v4
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        with:
          persist-credentials: false
      - name: Download shared verified site artifact
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: browser-pr-site-${{ github.run_id }}
          path: .
      - name: Verify shared site artifact checksums
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        run: sha256sum --strict -c _site.sha256
      - uses: ./.github/actions/setup-playwright
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
      - name: Run routes-focus primary
        if: success() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        run: tools/run_a11y_ci_shard.sh routes-focus primary
      - name: Upload routes-focus primary evidence
        if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: a11y-pr-shard-routes-focus-primary-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/a11y-pr-shard-routes-focus-primary-logs
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # A separate job is a separate GitHub-hosted VM, resetting the failure domain that
  # same-runner browser-process retries cannot clear. It runs at most once.
  a11y-routes-focus-retry:
    name: Accessibility + language shard (routes-focus fresh-runner retry)
    needs: [changes, unit, browser-pr-site, a11y-routes-focus-primary]
    if: always() && needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && needs.browser-pr-site.result == 'success' && needs.a11y-routes-focus-primary.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download shared verified site artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-pr-site-${{ github.run_id }}
          path: .
      - name: Verify shared site artifact checksums
        run: sha256sum --strict -c _site.sha256
      - uses: ./.github/actions/setup-playwright
      - name: Retry routes-focus on a fresh hosted runner
        run: tools/run_a11y_ci_shard.sh routes-focus fresh-runner-retry
      - name: Upload routes-focus fresh-runner retry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-pr-shard-routes-focus-fresh-runner-retry-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/a11y-pr-shard-routes-focus-fresh-runner-retry-logs
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # readable-or-else (github.com/jimdc/readable-or-else): ratchet-mode reading-level gate
  # against the committed baseline (nycsg7 = NYC Web Content Style Guide, FK grade 7). Its
  # own job — the first that needs textstat/beautifulsoup4, keep that isolated.
  # Not yet on PyPI; install straight from the (public) source repo.
  reading-level:
    name: Reading-level ratchet gate (readable-or-else)
    # Fail-fast: wait for Unit tests so we can skip the text-stat pass with a completed
    # required-check conclusion when Unit checks already failed.
    needs: [changes, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Changelog-only, non-frontend, or unit-failed — report required check success
        if: needs.changes.outputs.unit_full != 'true' || needs.changes.outputs.frontend != 'true' || needs.unit.result != 'success'
        run: |
          if [ "${{ needs.unit.result }}" != "success" ] && \
             [ "${{ needs.changes.outputs.unit_full }}" = "true" ] && \
             [ "${{ needs.changes.outputs.frontend }}" = "true" ]; then
            echo "Skipping reading-level suite because unit failed — re-run after unit is green."
          else
            echo "Skipping reading-level suite (unit_full=${{ needs.changes.outputs.unit_full }}, frontend=${{ needs.changes.outputs.frontend }})."
          fi
          echo "Reporting success for 'Reading-level ratchet gate (readable-or-else)'."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success'
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success'
        with:
          node-version: 20
      - name: Install readable-or-else
        if: needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success'
        run: pip install git+https://github.com/jimdc/readable-or-else.git
      - name: Reading-level ratchet gate
        if: needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success'
        run: |
          python3 test/standards/reading_level.py \
            --root site \
            --mode ratchet \
            --baseline site/reading-level-baseline.json \
            --format gh-annotations \
            about.html api.html changelog.html data.html index.html stats.html standards.html
          python3 test/standards/reading_level.py \
            --root site \
            --max-grade 7 \
            --format gh-annotations \
            following/index.html
          node tools/property_a11y_census.mjs \
            --limit 50000 \
            --ratchet-baseline site/property-a11y-ratchet.json \
            --format markdown
          node tools/now_reading_level.mjs \
            --baseline site/now-reading-level-ratchet.json \
            --format markdown
          node tools/near_you_reading_level.mjs \
            --baseline site/near-you-reading-level-ratchet.json \
            --format markdown
      # Opt-in only — a manually-labeled PR gets LLM-drafted plain-language suggestions as
      # PR-ready JSON (not auto-applied; a human reviews and accepts/discards). Needs
      # READABLE_OR_ELSE_LLM_BASE / READABLE_OR_ELSE_LLM_KEY / READABLE_OR_ELSE_LLM_MODEL
      # repo secrets pointed at an OpenAI-compatible endpoint — this repo doesn't have them
      # yet, so this step never runs until they're added. `fix` mode (auto-apply, gated by
      # readable-or-else's denial rules) is documented in that repo's README as the next step
      # up from --suggest; wiring it as an auto-commit CI step is a separate, deliberate
      # opt-in this repo hasn't taken — see AGENTS.md.
      - name: Suggest simplifications (opt-in via PR label)
        if: needs.changes.outputs.unit_full == 'true' && needs.changes.outputs.frontend == 'true' && needs.unit.result == 'success' && (contains(github.event.pull_request.labels.*.name, 'suggest-rewrite'))
        env:
          READABLE_OR_ELSE_LLM_BASE: ${{ secrets.READABLE_OR_ELSE_LLM_BASE }}
          READABLE_OR_ELSE_LLM_KEY: ${{ secrets.READABLE_OR_ELSE_LLM_KEY }}
          READABLE_OR_ELSE_LLM_MODEL: ${{ secrets.READABLE_OR_ELSE_LLM_MODEL }}
        run: |
          readable-or-else check site/data.html site/index.html \
            --preset nycsg7 --mode warn --suggest --format json \
            > readable-or-else-suggestions.json

  # Pre-merge changelog reading-level safeguard — deliberately NOT frontend-gated.
  # update-changelog.yml harvests a "What this means for you" entry only from a PR labeled
  # Manual full functional suite (workflow_dispatch only). Not a required check.
  # a11y-pr already covers the accessibility/language/demo-link/focus subset on every
  # PR. This job retains unique numbered specs 01–10, 13, 18, 19_rules_time_spine,
  # 20_navigation_history and the full run.sh loop for operator deep dives — do not
  # retire until those scripts are promoted or explicitly dropped.
  functional:
    name: Functional (Playwright, manual)
    needs: changes
    if: github.event_name == 'workflow_dispatch' && needs.changes.outputs.unit_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-playwright
      - name: Run functional suite
        run: bash test/functional/run.sh
