name: Refresh live preset fallback

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 13 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-preset-fallback-main
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh generated preset fallback on main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate the live-derived fallback
        run: node tools/validate_presets.mjs --write
      - name: Guard generated changes
        id: generated
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "Preset fallback is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              site/app/search-share.mjs|worker/src/lib/suggestions.mjs|site/data/preset-validation.json) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the fallback refresh pull request
        if: steps.generated.outputs.changed == 'true'
        id: refresh-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/refresh-preset-fallback
          delete-branch: true
          commit-message: Refresh live-derived preset fallback
          title: Refresh live-derived preset fallback
          body: |
            Automated refresh of the live-derived preset fallback.

            Validation: `node tools/validate_presets.mjs --check`
          add-paths: |
            site/app/search-share.mjs
            worker/src/lib/suggestions.mjs
            site/data/preset-validation.json
      # A PR created with GITHUB_TOKEN does not reliably start required checks without
      # approval. workflow_dispatch is an explicit token exception and reports the same
      # required job contexts on the refresh branch before it enters the merge queue.
      - name: Run required checks for the refresh pull request
        if: steps.refresh-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yml --ref automation/refresh-preset-fallback
