name: Refresh citywide address index

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-geocoder-address-index-main
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh official PAD snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the citywide address index
        run: |
          node tools/build_geocoder_address_index.mjs --from-live
          node tools/build_geocoder_address_index.mjs --check
      - name: Refresh dependent address geography outputs
        run: |
          # PAD content changes invalidate parcel memberships and every
          # committed --check artifact that declares those refreshed inputs
          # (today: Land place-membership generation). The registry owns the
          # ordered rebuild so a new dependent gate cannot be left out.
          node ops/address-index-refresh/rebuild-dependent-geography.mjs --check-registry
          node ops/address-index-refresh/rebuild-dependent-geography.mjs
      - name: Guard generated changes
        id: generated
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "The PAD snapshot and dependent geography outputs are already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              site/data/address-index/*.json) ;;
              site/data/meeting-geography-backfill|site/data/meeting-geography-backfill/*) ;;
              site/data/shared_meeting_read_model.json) ;;
              site/data/parcel-geography|site/data/parcel-geography/*) ;;
              site/data/land_place_membership.json) ;;
              site/data/land-place-evidence|site/data/land-place-evidence/*) ;;
              site/data/land-place-generations|site/data/land-place-generations/*) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the address-index refresh pull request
        if: steps.generated.outputs.changed == 'true'
        id: refresh-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REFRESH_PR_TOKEN }}
          branch: automation/refresh-geocoder-address-index
          delete-branch: true
          commit-message: Refresh citywide address index and dependent geography
          title: Refresh citywide address index and dependent geography
          body: |
            Automated refresh of the NYC Department of City Planning Property Address Directory snapshot and the dependent address-geography membership outputs, including Land place-membership generation when parcel geography changes.

            Validation:
            - `node tools/build_geocoder_address_index.mjs --check`
            - `node ops/address-index-refresh/rebuild-dependent-geography.mjs --check-registry`
            - `node tools/address_geography_refresh.mjs --check`
            - `node tools/land_place_refresh.mjs --check`
            - `node tools/build_land_place_membership.mjs --check`
          add-paths: |
            site/data/address-index/*.json
            site/data/meeting-geography-backfill/**
            site/data/shared_meeting_read_model.json
            site/data/parcel-geography/**
            site/data/land_place_membership.json
            site/data/land-place-evidence/**
            site/data/land-place-generations/**
      - name: Run required checks for the refresh pull request
        if: steps.refresh-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        run: gh workflow run ci.yml --ref automation/refresh-geocoder-address-index
      - name: Queue the verified refresh for merge
        if: steps.refresh-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
          REFRESH_PR: ${{ steps.refresh-pr.outputs.pull-request-number }}
          REFRESH_HEAD: ${{ steps.refresh-pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$REFRESH_PR" --auto --match-head-commit "$REFRESH_HEAD"
