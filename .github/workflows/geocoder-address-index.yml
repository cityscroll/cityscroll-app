name: Refresh citywide address index

on:
  schedule:
    - cron: "47 9 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-geocoder-address-index-main
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh official PAD snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the citywide address index
        run: |
          node tools/build_geocoder_address_index.mjs --from-live
          node tools/build_geocoder_address_index.mjs --check
      - name: Guard generated changes
        id: generated
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "The PAD snapshot is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              site/data/address-index/*.json) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open or update the address-index refresh pull request
        if: steps.generated.outputs.changed == 'true'
        id: refresh-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REFRESH_PR_TOKEN }}
          branch: automation/refresh-geocoder-address-index
          delete-branch: true
          commit-message: Refresh citywide address index
          title: Refresh citywide address index
          body: |
            Automated refresh of the NYC Department of City Planning Property Address Directory snapshot.

            Validation: `node tools/build_geocoder_address_index.mjs --check`
          add-paths: site/data/address-index/*.json
      - name: Run required checks for the refresh pull request
        if: steps.refresh-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        run: gh workflow run ci.yml --ref automation/refresh-geocoder-address-index
      - name: Queue the verified refresh for merge
        if: steps.refresh-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
          REFRESH_PR: ${{ steps.refresh-pr.outputs.pull-request-number }}
          REFRESH_HEAD: ${{ steps.refresh-pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$REFRESH_PR" --auto --match-head-commit "$REFRESH_HEAD"
