name: First-class dataset refresh

# Every first-class resident dataset declares a refresh cadence in
# site/data/source_contracts.json#first_class_artifacts, and production refuses
# to publish one that is past its hard maximum age. Nothing was running that
# refresh on a schedule, so the datasets aged out between hand-committed
# updates and blocked the deploy. This job runs the declared acquisition and
# owning builder for every dataset that is due and opens a pull request with
# whatever it refreshed.
#
# Datasets whose acquisition reads the retained analytical warehouse cannot run
# here: a hosted runner has no warehouse catalog. Their refresh runs on the
# machine that holds it — see ops/first-class-refresh/README.md. Their
# acquisition is still attempted so the receipt records the gap honestly, and a
# failed acquisition leaves the last verified artifact in place.
on:
  schedule:
    # Early morning UTC, after the City's overnight open-data publishing window.
    - cron: "40 6 * * *"
  workflow_dispatch:
    inputs:
      run_all:
        description: Refresh every dataset, not only the ones that are due.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: first-class-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh due first-class datasets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The complete test families read historical governance trees and refs.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Worker dependencies
        run: tools/install_worker_dependencies.sh
      - uses: ./.github/actions/setup-playwright
      # Same pinned poppler-utils contract as .github/actions/build-site: FlateDecode
      # calendar/rule PDFs need pdftotext; pin by Ubuntu suite so apt drift cannot
      # silently change extraction.
      - name: Install PDF text extraction for rule evidence
        run: |
          set -euo pipefail
          . /etc/os-release
          case "${VERSION_CODENAME:-}" in
            noble) pkg="poppler-utils=24.02.0-1ubuntu9.9" ;;
            jammy) pkg="poppler-utils=22.02.0-2ubuntu0.13" ;;
            *)
              echo "Unsupported runner suite '${VERSION_CODENAME:-unknown}' for pinned poppler-utils (expected noble or jammy)" >&2
              exit 1
              ;;
          esac
          sudo apt-get update
          sudo apt-get install -y "$pkg"
          command -v pdftotext >/dev/null
          pdftotext -v

      # Record the job start so the retained run history can name started_at
      # separately from the finish instant written with the receipt.
      - name: Record refresh start time
        run: echo "FIRST_CLASS_REFRESH_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # A still-open dated refresh branch must enter prior_runs before this run
      # force-updates that branch; otherwise a later dispatch drops it. Reading
      # those tips is the whole point; this step does not push or amend them.
      - name: Capture any unmerged refresh run history
        run: |
          set -euo pipefail
          mkdir -p .artifacts/first-class-refresh
          idx=0
          while IFS=$'\t' read -r _sha ref; do
            [ -n "${ref:-}" ] || continue
            branch="${ref#refs/heads/}"
            case "$branch" in
              data/first-class-refresh-*) ;;
              *) continue ;;
            esac
            git fetch --depth=1 origin "$branch"
            if git cat-file -e "FETCH_HEAD:site/data/first_class_refresh_run_history.json" 2>/dev/null; then
              git show "FETCH_HEAD:site/data/first_class_refresh_run_history.json" \
                > ".artifacts/first-class-refresh/pending-receipt-${idx}.json"
              idx=$((idx + 1))
            fi
          done < <(git ls-remote --heads origin 'data/first-class-refresh-*' || true)

      - name: Run the declared acquisition and builder for every due dataset
        env:
          LEGISTAR_API_TOKEN: ${{ secrets.LEGISTAR_API_TOKEN }}
        run: |
          set -o pipefail
          # The committee sample records when it was retrieved, so the run stamps
          # its own instant rather than inheriting a fixed date.
          export COMMITTEE_RETRIEVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mode="--run-due"
          if [ "${{ inputs.run_all }}" = "true" ]; then mode="--run-all"; fi
          node tools/first_class_refresh.mjs "$mode"

      - name: Rebuild the committed read models the refreshed datasets feed
        # --run-due stops after each dataset's owning builder. The keyword search
        # index, the agency constellation documents, and the generated
        # source-contract projections are committed read models derived from those
        # datasets, and continuous integration re-derives each one in check mode.
        # Refreshing the inputs without rebuilding the read models opens a pull
        # request that fails its own freshness gates. The registry beside this
        # script records which gates it covers and which it deliberately leaves to
        # the warehouse-held half of the refresh.
        #
        # The script itself never aborts partway through the sequence: one failed
        # or blocked step is recorded in .artifacts/first-class-rebuild-receipt.json
        # and every step that does not depend on it still runs. continue-on-error
        # here keeps that promise at the workflow level too — a report of failure
        # on this step must not skip the summary and pull-request steps below it,
        # or the datasets that did rebuild cleanly are discarded along with the
        # one that did not. The job is still failed for visibility; see the last
        # step in this file.
        id: rebuild
        continue-on-error: true
        run: node ops/first-class-refresh/rebuild-committed-read-models.mjs

      # No `if:` here, deliberately: a step with continue-on-error: true does
      # not fail the job, so the default success() condition on every step
      # after it still runs exactly as if the rebuild had succeeded — that is
      # what actually keeps publication from being skipped, not an always()
      # override. always() would also run this against a genuinely broken
      # checkout if an earlier, non-continue-on-error step (checkout, Worker
      # dependency install, Playwright setup) had failed, which is not this
      # fix's concern and must still stop the run as it always has.
      #
      # Written from the working tree exactly as it stands after the rebuild
      # step and before the commit below stages it, so "published" reflects
      # what is actually about to be committed rather than a later guess.
      # Per dataset: was it due, did its acquisition and builder succeed, did
      # the rebuild steps that feed it succeed, and is it publishing — the
      # health of a dataset that never ran and one that ran and could not
      # publish otherwise look identical from either receipt alone.
      # Writes site/data/first_class_refresh_run_history.json (committed inside
      # the refresh pull request) and mirrors it under .artifacts/ for the
      # summary and upload-artifact steps. prior_runs is append-only: any
      # unmerged dated-branch tip captured above is merged in, and a publish
      # that would drop a retained run fails here instead.
      - name: Write the combined first-class refresh run receipt
        run: |
          set -euo pipefail
          pending_args=()
          for pending in .artifacts/first-class-refresh/pending-receipt-*.json; do
            [ -f "$pending" ] || continue
            pending_args+=(--pending-receipt "$pending")
          done
          node tools/first_class_refresh_run_receipt.mjs "${pending_args[@]}"

      - name: Retain the refresh receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-class-refresh-receipts-${{ github.run_id }}
          path: |
            .artifacts/first-class-refresh-receipt.json
            .artifacts/first-class-rebuild-receipt.json
            .artifacts/first-class-refresh-run-receipt.json
            site/data/first_class_refresh_run_history.json
            site/data/first_class_freshness_report.json
          if-no-files-found: warn

      - name: Summarise what refreshed
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from "node:fs";
          const readJson = (path) => existsSync(path) ? JSON.parse(readFileSync(path, "utf8")) : null;
          const receipt = readJson(".artifacts/first-class-refresh-receipt.json");
          const report = readJson("site/data/first_class_freshness_report.json");
          const rebuild = readJson(".artifacts/first-class-rebuild-receipt.json");
          const run = readJson(".artifacts/first-class-refresh-run-receipt.json");
          if (report) {
            const rows = report.surfaces.map((s) => `| ${s.public_artifact_path} | ${s.freshness_state} | ${s.age_hours ?? "—"} |`);
            console.log(`## First-class freshness: ${report.status}\n`);
            console.log(Object.entries(report.counts).map(([k, v]) => `- ${k}: ${v}`).join("\n"));
            console.log(`\n| artifact | state | age (h) |\n| --- | --- | --- |`);
            console.log(rows.join("\n"));
          } else {
            console.log("## First-class freshness: no report was written\n");
          }
          const failedAcquisitions = (receipt?.commands || []).filter((c) => c.status !== "succeeded");
          if (failedAcquisitions.length) {
            console.log(`\n### Commands that did not run cleanly\n`);
            for (const c of failedAcquisitions) console.log(`- \`${c.command.join(" ")}\` — ${c.status}${c.reason ? ` (${c.reason})` : ""}`);
          }
          // One failed or skipped rebuild step no longer stops this run from
          // reaching this summary or the pull request below it: whatever the
          // other steps rebuilt is still published, and this table is exactly
          // how a person or the reliability watchdog sees what did not.
          if (rebuild) {
            const problems = rebuild.steps.filter((s) => s.status !== "succeeded");
            if (problems.length) {
              console.log(`\n### Rebuild steps that did not succeed (${problems.length} of ${rebuild.total_steps})\n`);
              console.log(`| step | status | detail |\n| --- | --- | --- |`);
              for (const s of problems) {
                const detail = s.blocked_by ? `blocked by ${s.blocked_by}` : s.reason || (s.exit_code != null ? `exit ${s.exit_code}` : "");
                console.log(`| ${s.id} | ${s.status} | ${detail} |`);
              }
            } else {
              console.log(`\nAll ${rebuild.total_steps} rebuild steps succeeded.\n`);
            }
          } else {
            console.log("\n### Rebuild did not run to completion; no rebuild receipt was written\n");
          }
          if (run) {
            if (run.run) {
              console.log(`\n### Retained run\n`);
              console.log(`- run_id: \`${run.run.run_id}\``);
              console.log(`- trigger: \`${run.run.trigger}\``);
              console.log(`- started_at: ${run.run.started_at}`);
              console.log(`- finished_at: ${run.run.finished_at}`);
              console.log(`- prior_runs retained: ${(run.prior_runs || []).length}`);
              console.log(`- history path: \`site/data/first_class_refresh_run_history.json\``);
            }
            const due = run.datasets.filter((d) => d.due);
            console.log(`\n### Due datasets (${run.due_count} of ${run.total} declared, ${run.published_count} publishing)\n`);
            if (due.length) {
              console.log(`| dataset | acquisition | rebuild | published |\n| --- | --- | --- | --- |`);
              for (const d of due) console.log(`| ${d.public_artifact_path} | ${d.acquisition_status} | ${d.rebuild_status} | ${d.published} |`);
            } else {
              console.log("No first-class dataset was due this run — an idempotent no-op.\n");
            }
          }
          NODE

      # GitHub deliberately does not start workflows for pushes or pull
      # requests made with a job's own GITHUB_TOKEN, so a pull request opened
      # that way reported no checks at all and the merge queue could never
      # admit it — someone had to close and reopen it by hand. The branch push
      # and the pull request therefore both use the same automation token the
      # other scheduled refreshes already use, which does start the required
      # checks on the pull request's head commit.
      #
      # Reached normally (no always() needed — see the rebuild step's comment)
      # even when the rebuild step above reported problems, so whatever it did
      # manage to refresh is still published. A run with nothing to publish
      # (including one where the rebuild produced no usable output at all)
      # still reaches this step and exits cleanly with "No dataset changes to
      # publish", which is how a caller tells an idempotent no-op apart from a
      # run that refreshed something it could not publish.
      - name: Open a pull request with the refreshed datasets
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: bash tools/open_first_class_refresh_pr.sh

      # The rebuild step above never aborts partway through and always lets this
      # run reach publication, but a step that failed or was blocked is still a
      # real problem and the run must stay visibly red for it — the reliability
      # watchdog and any operator reading run history depend on that signal.
      # This runs last, after the pull request, so it fails the job without
      # having withheld anything that did succeed.
      - name: Fail the run if the rebuild reported a problem
        if: always()
        run: |
          if [ "${{ steps.rebuild.outcome }}" != "success" ]; then
            echo "the rebuild step reported one or more problems; see the run summary and .artifacts/first-class-rebuild-receipt.json" >&2
            exit 1
          fi
