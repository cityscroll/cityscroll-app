name: Live civic-data source contracts

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: live-civic-data-source-contracts
  cancel-in-progress: false

jobs:
  verify:
    name: Alert on upstream contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify live source contracts
        id: live
        continue-on-error: true
        run: |
          set -o pipefail
          node tools/verify_source_contracts.mjs --live 2>&1 | tee source-contract-live.log
      - name: Report upstream drift
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Live civic-data source contract drift";
            const output = fs.readFileSync("source-contract-live.log", "utf8").slice(-12000);
            const body = [
              "The daily live-source check found an upstream contract change.",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "```text",
              output,
              "```",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
              });
            }
      - name: Fail on upstream drift
        if: always() && steps.live.outcome == 'failure'
        run: exit 1
