name: Live civic-data source contracts

on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: live-civic-data-source-contracts
  cancel-in-progress: false

jobs:
  verify:
    name: Alert on upstream contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify live source contracts
        id: live
        continue-on-error: true
        env:
          # Optional: enables authenticated Legistar Bodies probe. Without it the
          # monitor still asserts the auth gate answers (HTTP 403), not 404/DNS.
          LEGISTAR_API_TOKEN: ${{ secrets.LEGISTAR_API_TOKEN }}
        run: |
          set -o pipefail
          node tools/verify_source_contracts.mjs --live 2>&1 | tee source-contract-live.log
      - name: Report upstream drift
        if: steps.live.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Live civic-data source contract drift";
            const output = fs.readFileSync("source-contract-live.log", "utf8").slice(-12000);
            const body = [
              "The daily live-source check found an upstream contract change.",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "```text",
              output,
              "```",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
              });
            }
      - name: Fail on upstream drift
        if: always() && steps.live.outcome == 'failure'
        run: exit 1

  acquire_official_roll_call_tranche:
    name: Acquire authenticated official roll-call tranche
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh official roll-call cohort
        env:
          LEGISTAR_API_TOKEN: ${{ secrets.LEGISTAR_API_TOKEN }}
        run: |
          set -o pipefail
          node tools/build_official_roll_call_tranche.mjs
      - name: Commit refreshed tranche artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          if ! git diff --quiet -- site/data/people_domain_observations.json site/data/person_votes_lookup.json site/data/legistar_sources/verification_receipts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/people_domain_observations.json site/data/person_votes_lookup.json site/data/legistar_sources/verification_receipts
            git commit -m "data: refresh official roll-call live tranche"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
              "HEAD:${{ github.ref_name }}"
          else
            echo "No tranche artifact changes."
          fi
