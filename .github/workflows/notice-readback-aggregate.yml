name: Notice read-back aggregate refresh

# The retained aggregate at docs/evidence/performance-drift/notice-readback-aggregate.json
# had no scheduled producer: it only changed through hand-run pull requests, so
# a calendar window could close with nothing re-reading it. This job runs the
# builder on a schedule and opens a pull request whenever the retained aggregate
# changes, the same shape the connected-history cycle uses for its own
# previously-unscheduled producer.
on:
  schedule:
    # Daily, after the daily performance-drift reader's RUM window closes.
    - cron: "45 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: notice-readback-aggregate
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild the retained Notice read-back aggregate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild the retained aggregate from production RUM
        env:
          ANALYTICS_ACCOUNT_ID: "8162581cb1d97e20a172031adb8a13af"
          ANALYTICS_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUM_ANALYTICS_DATASET: crol_rum_observations_v1
        run: node tools/build_notice_readback_aggregate.mjs

      - name: Guard generated changes
        id: generated
        run: |
          set -euo pipefail
          changed="$(git status --porcelain --untracked-files=all -- docs/evidence/performance-drift/notice-readback-aggregate.json)"
          if [ -z "$changed" ]; then
            echo "The builder produced no change; the retained aggregate is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the refresh pull request
        if: ${{ steps.generated.outputs.changed == 'true' }}
        id: refresh-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REFRESH_PR_TOKEN }}
          branch: automation/notice-readback-aggregate
          delete-branch: true
          commit-message: Record the scheduled Notice read-back aggregate
          title: Record the scheduled Notice read-back aggregate
          body: |
            Automated refresh of the retained Notice post-delivery read-back aggregate at `docs/evidence/performance-drift/notice-readback-aggregate.json`.

            Validation:
            - `node tools/build_notice_readback_aggregate.mjs --check`
            - `node --test test/notice_readback_aggregate.test.mjs`
          add-paths: |
            docs/evidence/performance-drift/notice-readback-aggregate.json

      - name: Run required checks for the refresh pull request
        if: ${{ steps.refresh-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        run: gh workflow run ci.yml --ref automation/notice-readback-aggregate

      - name: Queue the refresh for merge
        if: ${{ steps.refresh-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
          CYCLE_PR: ${{ steps.refresh-pr.outputs.pull-request-number }}
          CYCLE_HEAD: ${{ steps.refresh-pr.outputs.pull-request-head-sha }}
        run: bash tools/queue_automation_pr_after_checks.sh "$CYCLE_PR" "$CYCLE_HEAD"
