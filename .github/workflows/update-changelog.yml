# Maintains the machine-readable release-note contract after qualifying PR merges.
# The public changelog page is retired; this workflow updates only
# site/changelog-data.json on the existing bot-owned branch. Consumers that need release
# notes can read that public branch directly without creating a pull request or entering
# the merge queue.
name: Update machine changelog data

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  update:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_BRANCH: bot/changelog-update
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write PR body to a file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Load the latest machine changelog data
        run: |
          bash tools/prepare-changelog-base.sh "$BOT_BRANCH"
          cp site/changelog-data.json "$RUNNER_TEMP/before-data.json"

      - name: Extract a qualifying release-note entry
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node tools/gen_changelog.mjs \
            --number "${{ github.event.pull_request.number }}" \
            --url "${{ github.event.pull_request.html_url }}" \
            --merged-at "${{ github.event.pull_request.merged_at }}" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --labels "$PR_LABELS"

      - name: Publish a data-only commit when the contract changed
        run: |
          if diff -q "$RUNNER_TEMP/before-data.json" site/changelog-data.json >/dev/null; then
            echo "No new machine changelog entry."
            exit 0
          fi

          printf '%s\n' site/changelog-data.json | bash tools/changelog-path-guard.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BOT_BRANCH"
          git add site/changelog-data.json
          git commit -m "changelog data: record PR #${{ github.event.pull_request.number }}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:$BOT_BRANCH"
