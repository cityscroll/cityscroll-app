# Regenerates changelog.html's "Recent updates" list on every PR merge, so no one hand-edits
# the changelog. See CONTRIBUTING.md's "Changelog entries" section for the marker + label
# convention a PR body/labels need, and tools/gen_changelog.mjs for the extraction + rebuild
# logic.
#
# `main` sits behind a merge-queue ruleset, and the Actions token cannot be a bypass actor —
# a direct `git push` to `main` is rejected outright. So this workflow pushes to a standing
# bot branch (bot/changelog-update), opens or updates a PR from it, and enqueues that PR via
# the enqueuePullRequest GraphQL mutation instead of merging it itself.
#
# Loop guard, two layers:
#   1. Trigger type: this runs on `pull_request: types: [closed]` — an event GitHub only
#      raises through its own PR machinery. Nothing here calls that machinery directly on
#      `main` (no merge, no admin bypass), so nothing here can raise it recursively.
#   2. Fixed point: the bot's own PR (from bot/changelog-update) carries no
#      "## What this means for you" section by construction (see the PR body below). When
#      THAT PR merges, this workflow fires again, extracts nothing from its own body, and the
#      no-diff guard below exits before touching the branch — so the chain terminates after
#      one hop, not because the trigger can't fire again, but because there's nothing left to
#      regenerate. Multiple qualifying PRs merging before the queue processes the bot PR
#      accumulate onto that SAME open PR (each run reads the bot branch's current pending
#      state as its base) rather than opening one bot PR per entry.
#
# Self-landing (PR #83): main's ruleset requires four named status checks
# ("Unit tests (site + worker)", "Accessibility + language gate (axe on every PR)",
# "Stray-English guard (runtime, fixtures)", "Reading-level ratchet gate (readable-or-else)")
# on top of the merge queue, so arming auto-merge alone isn't enough — the bot PR still needs
# those checks to actually run and pass on its head SHA before it's mergeable at all. They
# never do on their own: GitHub requires a maintainer to click "Approve and run workflows" for
# ANY `pull_request`-triggered run whose author is GITHUB_TOKEN's bot identity
# (github-actions[bot]), even for a same-repo, non-fork branch like this one — confirmed live
# on PR #81, which sat with zero check runs on its head SHA (mergeStateStatus: BLOCKED) until
# a maintainer manually re-ran CI. The "Dispatch CI directly" step below routes around this:
# `workflow_dispatch` is a different trigger, and the fork/first-time-contributor approval
# gate is scoped to `pull_request`/`pull_request_target` events only — it doesn't apply here.
# Required-status-check matching keys on (SHA, check name), not on which event produced the
# check run, so a workflow_dispatch-triggered CI run on the bot branch's head SHA satisfies
# the same required checks a pull_request-triggered run would have. Once those pass, the
# existing enqueuePullRequest call (moved to after the wait) succeeds on its own.
#
# The wait step polls the bot PR's own statusCheckRollup for the four REQUIRED check names
# specifically, not the dispatched run's overall pass/fail — ci.yml's "functional" job (the
# Playwright suite against live APIs) only runs on workflow_dispatch, is documented as
# flaky, and isn't in the ruleset's required list; waiting on the whole run instead of the
# named checks would let an unrelated flake in that job block an otherwise-mergeable PR.
#
# Path guard: self-merge only arms when the bot's commit touches exclusively the files it owns
# (changelog-data.json, changelog.html), checked by tools/changelog-path-guard.sh — see the
# "Verify the bot only touched changelog-owned paths" step below and its test at
# test/changelog_path_guard.test.mjs. This is defense-in-depth on top of the fact that the
# commit step only ever stages those two files: if a future change to the generation script (or
# anything else) ever lands a different path on this branch, the guard fails closed and the PR
# is left unarmed for manual review instead of silently self-merging an unreviewed path.
name: Update changelog

on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: update-changelog
  cancel-in-progress: false

jobs:
  update:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BOT_BRANCH: bot/changelog-update
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write PR body to a file (avoids substituting untrusted content into a shell command)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Load the regeneration base (the bot branch's pending entries, if any; changelog.html always stays main's own current copy — see tools/prepare-changelog-base.sh)
        run: |
          bash tools/prepare-changelog-base.sh "$BOT_BRANCH"
          cp site/changelog-data.json "$RUNNER_TEMP/before-data.json"
          cp site/changelog.html "$RUNNER_TEMP/before-changelog.html"

      # Vacuity tripwire: tools/gen_changelog.mjs exits non-zero when the merged PR carries
      # changelog:major but no accepted user-impact section — that used to be a green no-op
      # while the public page went stale. Non-major merges still skip with exit 0.
      - name: Extract this PR's user-impact line (if labeled changelog:major) and regenerate the changelog
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          node tools/gen_changelog.mjs \
            --number "${{ github.event.pull_request.number }}" \
            --url "${{ github.event.pull_request.html_url }}" \
            --merged-at "${{ github.event.pull_request.merged_at }}" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --labels "$PR_LABELS"

      - name: Stop here if regeneration produced no change (explicit no-diff guard, before touching any branch)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
        run: |
          if diff -q "$RUNNER_TEMP/before-data.json" site/changelog-data.json >/dev/null \
             && diff -q "$RUNNER_TEMP/before-changelog.html" site/changelog.html >/dev/null; then
            # Second vacuity check: a changelog:major merge that leaves site/changelog-*
            # unchanged is only legal when the PR is already recorded. Any other empty delta
            # (path mismatch after a site-root move, write landing outside site/, etc.) is a
            # green lie — fail closed. Non-major merges are allowed to no-op.
            if echo ",${PR_LABELS}," | grep -qi ',changelog:major,'; then
              node --input-type=module -e '
                import fs from "node:fs";
                import { computeEntryAddition, parseLabels } from "./tools/gen_changelog.mjs";
                const data = JSON.parse(fs.readFileSync("site/changelog-data.json", "utf8"));
                const body = fs.readFileSync(process.env.RUNNER_TEMP + "/pr-body.md", "utf8");
                const result = computeEntryAddition(data.entries || [], {
                  number: Number(process.env.PR_NUMBER),
                  url: process.env.PR_URL || "",
                  mergedAt: process.env.PR_MERGED_AT || "",
                  body,
                  labels: parseLabels(process.env.PR_LABELS || ""),
                });
                if (result.reason === "already-recorded") {
                  console.log("PR already recorded — empty delta is expected.");
                  process.exit(0);
                }
                console.error(
                  "Vacuity tripwire: labeled changelog:major but site/changelog-data.json and " +
                    "site/changelog.html did not change (reason=" + result.reason + "). " +
                    "Refusing silent no-op."
                );
                process.exit(1);
              '
            fi
            echo "No new entry (not labeled changelog:major, already recorded, or nothing changed) — nothing to do."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_ENV"

      - name: Push the bot branch and open or update its PR
        if: env.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BOT_BRANCH"
          git add site/changelog-data.json site/changelog.html
          git commit -m "changelog: PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}"
          # Force-push is expected and safe here: this branch is bot-owned (never hand-edited),
          # rebuilt fresh from main's tip every run, and the concurrency group above serializes
          # runs so there's no concurrent writer to race against.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:$BOT_BRANCH"

          EXISTING_PR="$(gh pr list --head "$BOT_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING_PR" ]; then
            PR_NUMBER="$EXISTING_PR"
            echo "Updated existing bot PR #$PR_NUMBER"
          else
            # Body lives in its own file (.github/changelog-bot-pr-body.md), not an inline
            # heredoc — a heredoc terminator can't sit inside a YAML `run: |` block at the
            # indentation bash requires without either breaking the YAML parse or never
            # matching at runtime.
            gh pr create --base main --head "$BOT_BRANCH" \
              --title "changelog: automated update" \
              --body-file .github/changelog-bot-pr-body.md
            PR_NUMBER="$(gh pr list --head "$BOT_BRANCH" --state open --json number --jq '.[0].number')"
            echo "Opened bot PR #$PR_NUMBER"
          fi
          echo "$PR_NUMBER" > "$RUNNER_TEMP/bot-pr-number"

      # Hard guard, independent of the two loop guards above: self-merge below only arms when
      # this commit touches exactly the files the bot owns (tools/changelog-path-guard.sh, kept
      # in sync with what tools/gen_changelog.mjs writes). By construction the commit above only
      # ever stages changelog-data.json and changelog.html, so this should always pass — it
      # exists as a second, independent check against a future regression in the generation
      # script (or anything else landing on this branch) silently getting an unreviewed path
      # merged. A guard failure leaves the PR open and unarmed for a human to look at; it never
      # blocks pushing or opening the PR itself.
      - name: Verify the bot only touched changelog-owned paths (hard guard before arming self-merge)
        if: env.changed == 'true'
        run: |
          CHANGED_PATHS="$(git diff --name-only main HEAD)"
          echo "Changed paths on $BOT_BRANCH vs main:"
          echo "$CHANGED_PATHS"
          if echo "$CHANGED_PATHS" | bash tools/changelog-path-guard.sh; then
            echo "paths_ok=true" >> "$GITHUB_ENV"
          else
            PR_NUMBER="$(cat "$RUNNER_TEMP/bot-pr-number")"
            echo "::warning::PR #$PR_NUMBER touches paths outside the changelog surface — leaving it for manual review, not arming self-merge"
            echo "paths_ok=false" >> "$GITHUB_ENV"
          fi

      # Arm GitHub auto-merge (squash) once the path guard passes. The create step above writes
      # the bot PR number to $RUNNER_TEMP/bot-pr-number (from gh pr create / gh pr list). With
      # "Allow auto-merge" on and no remaining required checks, --auto may merge immediately;
      # otherwise it waits until the required checks (dispatched below) are green. The bot PR
      # body has no "## What this means for you" section, so a re-run after this merge is a
      # fixed point and opens no further PR.
      - name: Arm auto-merge on the bot PR
        if: env.changed == 'true' && env.paths_ok == 'true'
        run: |
          PR_NUMBER="$(cat "$RUNNER_TEMP/bot-pr-number")"
          if gh pr merge "$PR_NUMBER" --auto --squash; then
            echo "Armed auto-merge (squash) on bot PR #$PR_NUMBER"
          else
            echo "::warning::could not arm auto-merge on PR #$PR_NUMBER — will still try the merge-queue enqueue after checks"
          fi

      # See the file-header comment above for why this step exists: `pull_request`-triggered
      # CI on this branch would sit at "action_required" forever without a maintainer's click.
      - name: Dispatch CI directly on the bot branch (workflow_dispatch bypasses the pull_request-event approval gate) and wait for the required checks
        if: env.changed == 'true' && env.paths_ok == 'true'
        timeout-minutes: 20
        run: |
          gh workflow run ci.yml --ref "$BOT_BRANCH"
          PR_NUMBER="$(cat "$RUNNER_TEMP/bot-pr-number")"

          # Keep this list in sync with the "required_status_checks" contexts on main's
          # ruleset (`gh api repos/OWNER/REPO/rules/branches/main`).
          REQUIRED_CHECKS=(
            "Unit tests (site + worker)"
            "Accessibility + language gate (axe on every PR)"
            "Stray-English guard (runtime, fixtures)"
            "Reading-level ratchet gate (readable-or-else)"
          )

          ci_ok=false
          for i in $(seq 1 80); do
            sleep 15
            ROLLUP="$(gh pr view "$PR_NUMBER" --json statusCheckRollup --jq '.statusCheckRollup // []')"
            all_done=true
            all_green=true
            for name in "${REQUIRED_CHECKS[@]}"; do
              ENTRY="$(echo "$ROLLUP" | jq -c --arg n "$name" '[.[] | select(.name==$n)][0] // {}')"
              status="$(echo "$ENTRY" | jq -r '.status // "PENDING"')"
              conclusion="$(echo "$ENTRY" | jq -r '.conclusion // ""')"
              if [ "$status" != "COMPLETED" ]; then
                all_done=false
              elif [ "$conclusion" != "SUCCESS" ]; then
                all_green=false
              fi
            done
            if [ "$all_done" = "true" ]; then
              [ "$all_green" = "true" ] && ci_ok=true
              break
            fi
          done

          if [ "$ci_ok" = "true" ]; then
            echo "Required checks passed on $BOT_BRANCH (PR #$PR_NUMBER)"
            echo "ci_ok=true" >> "$GITHUB_ENV"
          else
            echo "::warning::required checks didn't all pass on $BOT_BRANCH within the poll window — leaving bot PR #$PR_NUMBER for manual review"
            echo "ci_ok=false" >> "$GITHUB_ENV"
          fi

      - name: Enqueue the bot PR now that its required checks are satisfied
        if: env.changed == 'true' && env.paths_ok == 'true' && env.ci_ok == 'true'
        run: |
          PR_NUMBER="$(cat "$RUNNER_TEMP/bot-pr-number")"
          PR_NODE_ID="$(gh pr view "$PR_NUMBER" --json id --jq .id)"
          gh api graphql -f query='
            mutation($prId: ID!) {
              enqueuePullRequest(input: {pullRequestId: $prId}) {
                mergeQueueEntry { position }
              }
            }' -f prId="$PR_NODE_ID" \
            || echo "::warning::could not auto-enqueue PR #$PR_NUMBER — add it to the merge queue manually"
