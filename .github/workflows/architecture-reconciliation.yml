name: Architecture reconciliation

on:
  pull_request:
    # architecture/observer-canaries.json is the single registration. This
    # filter must cover every listed path so a canary change fires CI.
    # site/** and tools/build_*.mjs keep search, constellation, and
    # materializer canaries on the trigger. Proof:
    # test/architecture_path_coverage.test.mjs
    paths:
      - "ARCHITECTURE.md"
      - "architecture/**"
      - "docs/adr/**"
      - "docs/architecture.md"
      - "entity_resolution/**"
      - "ontology/**"
      - "site/**"
      - "warehouse/**"
      - "worker/**"
      - "tools/build_*.mjs"
      - "tools/architecture_*.mjs"
      - "tools/backtest_architecture_canaries.mjs"
      - "tools/reconcile_architecture.mjs"
      - ".github/workflows/architecture-reconciliation.yml"
  merge_group:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  reconcile:
    name: Reconcile architecture evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check architecture reconciliation
        run: |
          node tools/architecture_evidence_shards.mjs --check
          node tools/reconcile_architecture.mjs --check --output-dir "$RUNNER_TEMP/architecture-evidence"
      - name: Replay frozen architecture canaries
        run: node tools/backtest_architecture_canaries.mjs --check
      - name: Upload short-lived architecture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-evidence-${{ github.event_name }}-${{ github.sha }}
          path: ${{ runner.temp }}/architecture-evidence
          if-no-files-found: ignore
          retention-days: 3
