name: Public consultations refresh

# The public consultations materialization is a first-class resident dataset
# with a hard maximum age: production refuses to publish
# site/data/consultations.json once its vintage passes that maximum, so every
# Pages deploy fails until a fresh materialization lands. It had no scheduled
# producer of its own — the bundled first-class dataset refresh publishes every
# dataset through one pull request, and an unrelated read-model rebuild failure
# there held this one back with it — so the dataset aged out on hand-merged
# refreshes alone and blocked deploys for a week. This job acquires the fixed
# consultation source set, rematerializes the artifact, and publishes a changed
# materialization through the same automation pull-request path the
# address-index refresh uses. A failed acquisition keeps the last verified
# artifact and fails this run visibly instead of committing stale data.
on:
  schedule:
    # Daily, after the City's overnight publishing window and ahead of the
    # scheduled Pages deploy. The cadence stays well inside the artifact's
    # hard maximum age; test/consultations_refresh_workflow.test.mjs asserts
    # schedule interval < maximum / 2 from this file and the freshness
    # registry.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: consultations-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Acquire and republish the consultations materialization
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A failed or partially failed acquisition preserves the last verified
      # materialization and exits non-zero, so the run fails here — before any
      # publication step — rather than committing stale or partial data.
      - name: Run the consultation refresh
        run: node tools/refresh_consultations.mjs

      - name: Guard generated changes
        id: generated
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "The consultations materialization is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              site/data/consultations.json) ;;
              *) echo "Unexpected generated change: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the consultations refresh pull request
        if: steps.generated.outputs.changed == 'true'
        id: refresh-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.REFRESH_PR_TOKEN }}
          branch: automation/consultations-refresh
          delete-branch: true
          commit-message: Refresh the public consultations materialization
          title: Refresh the public consultations materialization
          body: |
            Automated refresh of the public consultations materialization. `site/data/consultations.json` is a first-class resident dataset whose vintage has a hard maximum age, so it is re-observed from its fixed organizer-linked source set on a schedule. Only the materialization changes here: the dependent materializers rebuild from the fixed organizer seeds and do not consume this retained JSON vintage.

            Validation:
            - `node --test test/consultation*.test.mjs worker/test/consultation*.test.mjs`
            - `node --test test/consultations_refresh_workflow.test.mjs`
            - `node tools/first_class_refresh.mjs --check-production`
          add-paths: |
            site/data/consultations.json

      - name: Run required checks for the refresh pull request
        if: steps.refresh-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
        run: gh workflow run ci.yml --ref automation/consultations-refresh

      - name: Queue the refreshed materialization for merge
        if: steps.refresh-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.REFRESH_PR_TOKEN }}
          REFRESH_PR: ${{ steps.refresh-pr.outputs.pull-request-number }}
          REFRESH_HEAD: ${{ steps.refresh-pr.outputs.pull-request-head-sha }}
        run: gh pr merge "$REFRESH_PR" --auto --match-head-commit "$REFRESH_HEAD"
