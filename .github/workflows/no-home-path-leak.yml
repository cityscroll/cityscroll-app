name: Home path leak guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-home-path-leak:
    name: Reject absolute home paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan tracked files
        shell: bash
        run: |
          set -euo pipefail
          # Build the expression in pieces so this workflow does not match itself.
          path_segment='[A-Za-z][A-Za-z0-9._-]*'
          pattern='/Users/'"$path_segment/"
          linux_pattern='/home/'"$path_segment/"
          tilde_pattern="(^|[[:space:]]|[\"'\`=(:,])~/$path_segment(/[A-Za-z0-9._-]+)*"

          # Add # leak-allow to a matching line when the path is intentional and documented.
          matches=''
          for candidate in "$pattern" "$linux_pattern" "$tilde_pattern"; do
            found="$(git grep --cached -n -I -E "$candidate" -- ':!.github/workflows/no-home-path-leak.yml' || true)"
            if [[ -n "$found" ]]; then
              matches+="$found"$'\n'
            fi
          done
          filtered=''
          if [[ -n "$matches" ]]; then
            while IFS= read -r line; do
              if [[ -n "$line" && "$line" != *'# leak-allow'* ]]; then
                filtered+="$line"$'\n'
              fi
            done <<< "$matches"
          fi
          matches="$filtered"
          if [[ -n "$matches" ]]; then
            echo "Home or machine path detected in tracked source:" >&2
            echo "$matches" >&2
            exit 1
          fi
