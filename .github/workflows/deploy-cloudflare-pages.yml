# Deploy the verified static site to the public Cloudflare Pages origin.
# GitHub Actions is the canonical production path so every main push has an
# observable deploy receipt. Cloudflare's native Git integration is optional.
# Cloudflare Pages is the production static origin; the Worker retains a narrow
# raw-repository document seam for compatibility-origin failures.
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    # 10:15 UTC lands before the NYC workday starts year-round (05:15 EST / 06:15 EDT),
    # so the daily Contracts (Money) resident-snapshot refresh below is in place before
    # residents load the page.
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      refresh_decision_outcomes:
        description: Refresh bounded Land and meeting outcomes before the production deploy
        required: false
        default: true
        type: boolean
      refresh_resident_snapshots:
        description: Refresh the Contracts (Money) resident snapshot and its dependent public artifacts before the production deploy
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  # Keep the semantic API readiness gate paired with the production static
  # deploy so a new client cannot outrun its matching route/read model.
  api-contract:
    name: Wait for project-connections API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require complete or honestly unavailable project connections
        run: node tools/project_connections_smoke.mjs --timeout-ms 720000 --interval-ms 20000

  deploy:
    name: Deploy public Cloudflare Pages origin
    needs: api-contract
    runs-on: ubuntu-latest
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment-url }}
      pages_alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
      is_preview: ${{ steps.branch.outputs.is_preview }}
      smoke_base: ${{ steps.branch.outputs.smoke_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve deploy branch and smoke base
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          branch="main"
          is_preview=false
          smoke_base="https://cityscroll.pages.dev/"
          {
            echo "branch=${branch}"
            echo "is_preview=${is_preview}"
            echo "smoke_base=${smoke_base}"
          } >> "$GITHUB_OUTPUT"
      - name: Ensure stable Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ensure_stable_pages.mjs project
      - name: Build verified site artifact
        uses: ./.github/actions/build-site
        with:
          refresh-decision-outcomes: ${{ github.event_name == 'push' || inputs.refresh_decision_outcomes }}
          refresh-resident-snapshots: ${{ github.event_name == 'push' || github.event_name == 'schedule' || inputs.refresh_resident_snapshots }}
      - name: Verify hosting budgets
        run: node tools/check_pages_bundle_sizes.mjs --site-dir _site
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.110.0"
          command: >-
            pages deploy _site
            --project-name=cityscroll
            --branch=${{ steps.branch.outputs.branch }}
            --commit-hash=${{ github.sha }}
            --commit-message="Static site deploy"
            --commit-dirty=false
      - name: Publish deployment receipt
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PAGES_ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          SMOKE_BASE: ${{ steps.branch.outputs.smoke_base }}
          IS_PREVIEW: ${{ steps.branch.outputs.is_preview }}
          PAGES_URL: https://cityscroll.pages.dev
        shell: bash
        run: |
          {
            echo "## Cloudflare Pages"
            echo
            echo "Production deployment from the canonical GitHub Actions release path."
            echo
            echo "Production alias: [$PAGES_URL]($PAGES_URL)"
            echo
            echo "cityscroll.org and www.cityscroll.org use this Cloudflare Pages project as the production static origin."
            echo
            echo "Immutable deployment: [$DEPLOYMENT_URL]($DEPLOYMENT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Bind Pages deployment to release-surface receipt
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          if [ ! -f .artifacts/release-surface-receipt.json ]; then
            echo "release-surface receipt is unavailable after the build" >&2
            exit 0
          fi
          status="UNKNOWN"
          if [ "$DEPLOYMENT_OUTCOME" = "success" ]; then status="PASS"; fi
          if [ "$DEPLOYMENT_OUTCOME" = "failure" ]; then status="FAIL"; fi
          node tools/update_release_surface_receipt.mjs \
            --receipt .artifacts/release-surface-receipt.json \
            --stage pages_deployment \
            --status "$status" \
            --required-stage pages_deployment \
            --provider-status "$DEPLOYMENT_OUTCOME" \
            --deployment-id "$DEPLOYMENT_URL" \
            --deployment-url "$DEPLOYMENT_URL" \
            --source-commit "$GITHUB_SHA" \
            --manifest _site/artifact-manifest.json
      - name: Write Pages deployment-health receipt
        if: always()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_OUTCOME: ${{ steps.deploy.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/deployment-health
          artifact_value=""
          if [ -f _site/artifact-manifest.json ]; then
            artifact_value="$(node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("_site/artifact-manifest.json","utf8")); process.stdout.write(m.artifact_hash || "")')"
          fi
          node tools/check_deployment_health.mjs --write \
            --boundary cloudflare-pages \
            --pipeline deploy-cloudflare-pages \
            --merged-source-sha "$GITHUB_SHA" \
            --deployed-commit-sha "$GITHUB_SHA" \
            --artifact-type pages-artifact-hash \
            --artifact-value "$artifact_value" \
            --deployment-id "$DEPLOYMENT_URL" \
            --deployment-url "$DEPLOYMENT_URL" \
            --provider-status "$DEPLOYMENT_OUTCOME" \
            --generation-receipt .artifacts/generation-output-receipt.json \
            --guard wrangler_pages_deploy:"$DEPLOYMENT_OUTCOME" \
            --workflow-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --output .artifacts/deployment-health/cloudflare-pages.json
      - name: Retain generation and release-surface receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-release-evidence-${{ github.run_id }}
          path: |
            .artifacts/generation-output-receipt.json
            .artifacts/release-surface-receipt.json
            .artifacts/deployment-health/cloudflare-pages.json
            _site/artifact-manifest.json
          if-no-files-found: warn

  smoke:
    name: Pages host live URL smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./.github/actions/setup-playwright
      - name: Download release-surface receipt from deploy job
        uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true
      - name: Resolve smoke origin (preview deploy or production alias)
        id: origin
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          SMOKE_BASE: ${{ needs.deploy.outputs.smoke_base }}
          IS_PREVIEW: ${{ needs.deploy.outputs.is_preview }}
        shell: bash
        run: |
          set -euo pipefail
          # Prefer the immutable deployment URL when present (exact bytes just uploaded).
          if [ -n "${DEPLOYMENT_URL:-}" ]; then
            base="${DEPLOYMENT_URL%/}"
          else
            base="${SMOKE_BASE%/}"
          fi
          {
            echo "base_url=${base}/"
            echo "base_host=${base}"
            echo "is_preview=${IS_PREVIEW}"
          } >> "$GITHUB_OUTPUT"
          echo "Smoke origin: ${base}/ (preview=${IS_PREVIEW})"
      - name: Smoke deploy target
        run: >-
          node tools/live_url_smoke.mjs
          --base-url ${{ steps.origin.outputs.base_host }}
          --timeout-ms 720000
          --interval-ms 20000
      - name: Route inventory parity vs live site (production only)
        if: needs.deploy.outputs.is_preview != 'true'
        run: >-
          node tools/pages_route_parity.mjs
          --reference https://cityscroll.org
          --candidate https://cityscroll.pages.dev
          --timeout-ms 720000
          --interval-ms 20000
          --out docs/evidence/cloudflare-pages-route-parity.md
      - name: Render demo-link contract on deploy target
        env:
          CROL_BASE: ${{ steps.origin.outputs.base_url }}
          CROL_DEMO_LINK_IDS: exam-guide
        run: python3 test/functional/20_demo_links.py
      - name: Post-deploy Contracts snapshot freshness smoke
        env:
          CROL_BASE: ${{ steps.origin.outputs.base_url }}
          CROL_CONTRACTS_FRESHNESS_STRICT: "1"
        run: python3 test/functional/48_contracts_freshness_live.py
      - name: Capture served artifact identity
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          node --input-type=module - <<'NODE'
          import { writeFileSync } from "node:fs";
          const base = "https://cityscroll.pages.dev";
          let evidence = { status: "FAIL", probe_status: "failed", reason: "served artifact manifest could not be fetched" };
          try {
            const response = await fetch(base + "/artifact-manifest.json");
            const manifest = await response.json();
            evidence = {
              status: response.ok ? "PASS" : "FAIL",
              probe_status: response.ok ? "success" : "failed",
              http_status: response.status,
              source_commit_sha: manifest.source_commit_sha || null,
              served_artifact_hash: manifest.artifact_hash || null
            };
          } catch (error) {
            evidence.reason = String(error?.message || error);
          }
          writeFileSync(".artifacts/live-probe.json", JSON.stringify(evidence, null, 2) + "\n");
          NODE
          probe_status="$(node -e 'const x=require("./.artifacts/live-probe.json"); process.stdout.write(x.status || "UNKNOWN")')"
          node tools/update_release_surface_receipt.mjs \
            --receipt .artifacts/release-surface-receipt.json \
            --stage live_smoke \
            --status "$probe_status" \
            --required-stage live_smoke \
            --evidence-file .artifacts/live-probe.json
      - name: Retain final Pages release-surface receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-release-evidence-final
          path: |
            .artifacts/release-surface-receipt.json
            .artifacts/live-probe.json
          if-no-files-found: warn
      - name: Post-deploy project-connections API smoke
        run: node tools/project_connections_smoke.mjs --timeout-ms 720000 --interval-ms 20000
      - name: Post-deploy project-connections browser smoke
        env:
          CROL_BASE: ${{ steps.origin.outputs.base_url }}
          # Keep deploy conclusions tied to a committed read-model canary.
          CROL_PROJECT_CONNECTIONS_ID: "2022M0258"
        run: python3 test/functional/27_project_connections_live.py
      - name: Upload parity report
        if: always() && needs.deploy.outputs.is_preview != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-route-parity
          path: docs/evidence/cloudflare-pages-route-parity.md
          if-no-files-found: ignore
