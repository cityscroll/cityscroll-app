# Deploys the verified static site to the public Cloudflare Pages origin.
# GitHub Pages remains deployed as the fallback origin.
name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy public Cloudflare Pages origin
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure stable Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/ensure_stable_pages.mjs project
      - uses: actions/configure-pages@v5
      - name: Build verified site artifact
        uses: ./.github/actions/build-site
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.110.0"
          command: >-
            pages deploy _site
            --project-name=cityscroll
            --branch=main
            --commit-hash=${{ github.sha }}
            --commit-message="Static site deploy"
            --commit-dirty=false
      - name: Publish deployment receipt
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          PAGES_URL: https://cityscroll.pages.dev
        shell: bash
        run: |
          {
            echo "## Cloudflare Pages (public origin)"
            echo
            echo "Production alias: [$PAGES_URL]($PAGES_URL)"
            echo
            echo "Immutable deployment: [$DEPLOYMENT_URL]($DEPLOYMENT_URL)"
            echo
            echo "cityscroll.org and www.cityscroll.org use this Pages project. GitHub Pages remains deployed as the fallback origin."
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Pages host live URL smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./.github/actions/setup-playwright
      - name: Smoke cityscroll.pages.dev
        run: >-
          node tools/live_url_smoke.mjs
          --base-url https://cityscroll.pages.dev
          --timeout-ms 720000
          --interval-ms 20000
      - name: Route inventory parity vs live site
        run: >-
          node tools/pages_route_parity.mjs
          --reference https://cityscroll.org
          --candidate https://cityscroll.pages.dev
          --timeout-ms 720000
          --interval-ms 20000
          --out docs/evidence/cloudflare-pages-route-parity.md
      - name: Render the live civil-service exam guide
        env:
          CROL_BASE: https://cityscroll.pages.dev/
          CROL_DEMO_LINK_IDS: exam-guide
        run: python3 test/functional/20_demo_links.py
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-pages-route-parity
          path: docs/evidence/cloudflare-pages-route-parity.md
          if-no-files-found: ignore
