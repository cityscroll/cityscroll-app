# Moves the beta Pages production pointer to one explicitly selected commit.
name: Promote exact commit to beta

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to publish or restore
        required: true
        type: string
      confirmation:
        description: Type PROMOTE to confirm the beta pointer change
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Point beta at selected commit
    environment:
      name: beta
      url: https://beta.cityscroll.org/
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact commit request
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          if [[ ! "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character SHA" >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "PROMOTE" ]; then
            echo "confirmation must equal PROMOTE" >&2
            exit 1
          fi
      - name: Check out current release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: release-tools
          persist-credentials: false
      - name: Ensure beta Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node release-tools/tools/ensure_beta_pages.mjs project
      - name: Check out the selected source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          path: source
          persist-credentials: false
      - name: Verify selected checkout
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: test "$(git -C source rev-parse HEAD)" = "$REQUESTED_SHA"
      - uses: actions/configure-pages@v5
      - name: Build verified beta artifact
        uses: ./release-tools/.github/actions/build-site
        with:
          source-dir: source
          site-dir: _site
          review-channel: beta
          commit-sha: ${{ inputs.commit_sha }}
      - name: Move beta production pointer
        id: deploy
        uses: cloudflare/wrangler-action@v3.14.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.110.0"
          command: >-
            pages deploy _site
            --project-name=crol-list-beta
            --branch=beta
            --commit-hash=${{ inputs.commit_sha }}
            --commit-message="Beta pointer update"
            --commit-dirty=false
      - name: Ensure beta custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node release-tools/tools/ensure_beta_pages.mjs domain
      - name: Verify beta pointer and noindex header
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
          BETA_URL: https://beta.cityscroll.org
        shell: bash
        run: |
          attempt=1
          while [ "$attempt" -le 10 ]; do
            metadata="$(curl --fail --silent --show-error "$BETA_URL/release-channel.json" || true)"
            actual_commit="$(
              printf '%s' "$metadata" \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s).commit||"")}catch{}})'
            )"
            headers="$(
              curl --fail --silent --show-error --head "$BETA_URL/" \
                | tr -d '\r' || true
            )"
            if [ "$actual_commit" = "$EXPECTED_COMMIT" ] \
              && printf '%s\n' "$headers" | grep -Eiq '^x-robots-tag:.*noindex'; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "beta.cityscroll.org did not resolve to the requested commit with noindex" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 3
          done
      - name: Publish promotion receipt
        env:
          IMMUTABLE_URL: ${{ steps.deploy.outputs.deployment-url }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          {
            echo "## Beta pointer updated"
            echo
            echo "Beta: [https://beta.cityscroll.org](https://beta.cityscroll.org)"
            echo
            echo "Immutable deployment: [$IMMUTABLE_URL]($IMMUTABLE_URL)"
            echo
            echo "Source commit: \`$COMMIT_SHA\`"
            echo
            echo "Rollback: rerun this workflow with the prior known-good commit SHA."
          } >> "$GITHUB_STEP_SUMMARY"
