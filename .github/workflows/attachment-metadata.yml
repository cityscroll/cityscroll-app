name: Daily attachment metadata

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      start_date:
        description: Optional first notice date (YYYY-MM-DD)
        required: false
      end_date:
        description: Optional last notice date (YYYY-MM-DD)
        required: false

permissions:
  contents: read

concurrency:
  group: attachment-metadata
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and materialize yesterday's attachments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install warehouse dependency
        run: python -m pip install -r warehouse/requirements.txt
      - name: Run bounded attachment delta
        env:
          CITYSCROLL_ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          CITYSCROLL_ATTACHMENT_ENDPOINT: https://api.cityscroll.org/admin/attachment-metadata
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
        run: |
          args=(--limit 200)
          if [[ -n "$INPUT_START_DATE" ]]; then args+=(--start-date "$INPUT_START_DATE"); fi
          if [[ -n "$INPUT_END_DATE" ]]; then args+=(--end-date "$INPUT_END_DATE"); fi
          python warehouse/scripts/attachment_metadata_run.py "${args[@]}"
      - name: Preserve run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attachment-metadata-receipt
          path: warehouse/receipts/attachment_metadata_latest.json
          if-no-files-found: error
          retention-days: 30
