name: Authenticated committee membership sample

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample_and_materialize:
    name: Sample and materialize committee memberships
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify committee gate logic
        run: node --test test/committee_graph.test.mjs

      - name: Run authenticated 30-person sample
        env:
          LEGISTAR_API_TOKEN: ${{ secrets.LEGISTAR_API_TOKEN }}
        run: |
          set -o pipefail
          export COMMITTEE_RETRIEVED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node tools/build_committee_graph.mjs

      - name: Verify publication is gated by the receipt
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { committeeGateAllowsPublication } from "./site/committee_graph.mjs";

          const graph = JSON.parse(await readFile("site/data/committee_graph_lookup.json", "utf8"));
          const receipt = JSON.parse(await readFile("site/data/committee_graph/verification_receipts/committee_sample_2026-08-12.json", "utf8"));
          const allowed = committeeGateAllowsPublication(receipt);
          if (graph.publication !== (allowed ? "published" : "held")) {
            throw new Error("committee graph publication does not match the receipt gate");
          }
          if (!allowed && graph.public_edges.length !== 0) {
            throw new Error("held committee sample exposed public membership edges");
          }
          if (allowed && graph.public_edges.length !== graph.edge_observations.length) {
            throw new Error("approved committee sample did not expose all retained observations");
          }
          if (!("denominator" in receipt.review)
            || !receipt.review.current_vs_historical_overlap) {
            throw new Error("committee receipt is missing denominator or overlap");
          }
          if (allowed && !Number.isFinite(receipt.review.denominator)) {
            throw new Error("published committee receipt is missing its denominator");
          }
          NODE

      - name: Commit gated graph and receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ -z "$(git status --short -- site/data/committee_graph_lookup.json worker/src/data/committee_graph_lookup.json site/data/committee_graph/verification_receipts/committee_sample_2026-08-12.json)" ]; then
            echo "No committee graph changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/committee_graph_lookup.json worker/src/data/committee_graph_lookup.json site/data/committee_graph/verification_receipts/committee_sample_2026-08-12.json
          git commit -m "data: refresh committee membership sample"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:${{ github.ref_name }}"
