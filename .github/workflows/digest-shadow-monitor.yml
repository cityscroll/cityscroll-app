name: Digest shadow monitor (manual legacy entry point)

# The twice-daily monitor and recovery issue loop are owned by the independent
# external-schedule runner. This manual entry point is retained as a visible
# migration marker; it deliberately performs no scheduled or issue mutation.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: echo "The scheduled digest-shadow monitor runs through tools/external_schedule_runner.mjs."
