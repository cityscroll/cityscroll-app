name: Digest shadow monitor

on:
  schedule:
    # The Worker builds previews at 10:00 UTC; allow ten minutes for the full live-data pass.
    - cron: "10 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: digest-shadow-monitor
  cancel-in-progress: false

jobs:
  inspect:
    name: Wake on digest redlines
    runs-on: ubuntu-latest
    steps:
      - name: Read the machine contract
        id: shadow
        continue-on-error: true
        env:
          CITYSCROLL_ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: |
          http_status=$(curl --silent --show-error \
            --output digest-shadow.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CITYSCROLL_ADMIN_KEY}" \
            https://api.cityscroll.org/admin/digest-shadow)
          test "$http_status" = "200"
          test "$(jq -r '.summary.run_day // empty' digest-shadow.json)" = "$(date -u +%F)"
          test "$(jq -r '.summary.status // empty' digest-shadow.json)" = "READY"
      - name: Upload private monitor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-shadow-summary
          path: digest-shadow.json
          retention-days: 14
      - name: Wake the repair loop
        if: steps.shadow.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const title = "Digest shadow run needs attention";
            let report = { error: "shadow endpoint unavailable" };
            try { report = JSON.parse(fs.readFileSync("digest-shadow.json", "utf8")); } catch {}
            const summary = report.summary || report;
            const redlines = Array.isArray(summary.redlines) ? summary.redlines : [];
            const sanitize = (value) => {
              if (Array.isArray(value)) return value.map(sanitize);
              if (value && typeof value === "object") {
                return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, sanitize(item)]));
              }
              if (typeof value !== "string") return value;
              return value
                .replace(/([?&](?:token|s)=)[^&\s]+/gi, "$1[redacted]")
                .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, "[redacted-email]");
            };
            const publicRedlines = redlines.map(({ code, digest_id, watch_id, reason, evidence }) => ({
              code, digest_id, watch_id, reason, evidence: sanitize(evidence),
            }));
            const body = [
              "The 06:00 ET digest rehearsal reported a redline. The repair loop should diagnose, fix, and re-run the affected digest build before the 09:00 ET send.",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "```json",
              JSON.stringify({
                contract: summary.contract || null,
                run_day: summary.run_day || null,
                status: summary.status || "UNAVAILABLE",
                affected_digest_ids: summary.affected_digest_ids || [],
                redlines: publicRedlines,
              }, null, 2).slice(0, 18000),
              "```",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
      - name: Keep the redline visible to scheduled monitoring
        if: always() && steps.shadow.outcome == 'failure'
        run: exit 1
