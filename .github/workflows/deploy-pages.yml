# Builds the static site before deployment so cache stamps never live in source commits.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Build verified site artifact
        uses: ./.github/actions/build-site
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  # The site and Worker deploy from separate workflows. Gate the public site on
  # the semantic API contract so a new client cannot outrun its matching route
  # or bundled read model during propagation.
  api-contract:
    name: Wait for project-connections API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require complete or honestly unavailable project connections
        run: node tools/project_connections_smoke.mjs --timeout-ms 720000 --interval-ms 20000

  deploy:
    name: Deploy site
    needs: [build, api-contract]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Fail the deploy workflow if the public apex (or a deep route) is looping,
  # non-200, empty, or serving an error shell. Polls inside a bounded window so
  # short-lived GitHub Pages / Fastly redirect-cache lag does not false-fail;
  # a sustained outage still fails the run instead of reporting a green deploy.
  smoke:
    name: Live URL smoke
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: ./.github/actions/setup-playwright
      - name: Post-deploy live URL smoke
        run: node tools/live_url_smoke.mjs --timeout-ms 720000 --interval-ms 20000
      - name: Post-deploy project-connections API smoke
        run: node tools/project_connections_smoke.mjs --timeout-ms 720000 --interval-ms 20000
      - name: Post-deploy project-connections browser smoke
        env:
          CROL_BASE: https://cityscroll.org/
        run: python3 test/functional/27_project_connections_live.py
