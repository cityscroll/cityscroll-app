<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compact month component — fixture harness</title>
<meta name="robots" content="noindex, nofollow">
<!--
  Repository-native test harness for the shared compact month component
  (CBICS-02). Not a shipped page: it exists only to give the headless
  evidence-capture script a neutral surface that mounts
  site/compact_calendar.mjs against committed fixtures. It is never linked
  from the public site and carries no domain content of its own.
-->
<link rel="stylesheet" href="../../site/compact_calendar.css">
<style>
  body { margin: 0; padding: 16px; background: #f5f6f8; }
  #mount { max-width: 720px; }
  #status { font: 12px monospace; color: #5b6470; margin-top: 12px; }
</style>
</head>
<body>
<main id="page" data-harness-state="pending">
<div id="mount"></div>
<p id="status"></p>
</main>
<script type="module">
  import { fixtureOccurrences, FIXTURE_TODAY } from "../fixtures/compact_calendar_fixtures.mjs";
  import { buildCompactMonthView, renderCompactMonth, bindCompactMonthPrintDisclosure } from "../../site/compact_calendar.mjs";

  const params = new URLSearchParams(location.search);
  const fixtureName = params.get("fixture") || "dense";
  const today = params.get("today") || FIXTURE_TODAY;
  const page = document.getElementById("page");
  const mount = document.getElementById("mount");
  const status = document.getElementById("status");

  const occurrences = fixtureOccurrences(fixtureName);
  const view = buildCompactMonthView(occurrences, { today });
  mount.innerHTML = renderCompactMonth(view, { fullListHref: "#full-list-placeholder", fullListLabel: "View the full list" });
  bindCompactMonthPrintDisclosure(mount);
  page.setAttribute("data-harness-state", view.render ? "rendered" : "non-render");
  page.setAttribute("data-harness-reason", view.render ? "eligible" : view.reason);
  status.textContent = `fixture=${fixtureName} today=${today} render=${view.render} reason=${view.render ? "eligible" : view.reason}`;
</script>
</body>
</html>
