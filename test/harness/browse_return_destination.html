<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event page — fixture destination</title>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<main>
  <h1>Event page</h1>
  <p id="which">A same-origin destination for the browse-return journey. Nothing here is a shipped page.</p>
</main>
<script>
  const uid = new URLSearchParams(location.search).get("uid") || "";
  document.getElementById("which").textContent = uid
    ? `Event page for ${uid}.`
    : "A same-origin destination for the browse-return journey.";
  document.title = uid ? `Event page · ${uid}` : document.title;
</script>
</body>
</html>
