<h2>How records are connected</h2>
<p>A connection is not a finding. Two records being linked is not evidence that money moved improperly, that an official acted wrongly, or that a decision was made because of the other record.</p>
<p>CityScroll cannot verify that a calendar subscription was added or refreshed.</p>
