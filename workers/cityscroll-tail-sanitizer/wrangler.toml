name = "cityscroll-tail-sanitizer"
main = "src/worker.mjs"
compatibility_date = "2026-07-27"
workers_dev = true

# Persistent observability intentionally ABSENT (disabled / not armed).
# Do not add an [observability] block. Privacy for Tail collection is the
# positive-allowlist sanitizer path, not enabling logs/traces.

[[durable_objects.bindings]]
name = "AGG_SINK"
class_name = "AggregateSink"

[[migrations]]
tag = "v1-tail-sanitizer-aggregate-sink"
new_sqlite_classes = ["AggregateSink"]

# READBACK_TOKEN is a Worker secret only (`wrangler secret put READBACK_TOKEN`).
# Do not declare it under [vars]: a plaintext placeholder collides with the
# secret binding name (Cloudflare API 10053). Runtime refuses readback while
# the secret is unset or equal to the literal "unset".
#
# EXPECTED_DEPLOYED_REVISIONS must be set at arm time (producer serving
# version id allowlist). Empty allowlist → all revisions map to "unknown".
# No KV namespace bindings: A2 storage cost is DO ops only.
